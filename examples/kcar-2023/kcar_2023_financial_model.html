<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이카 2023 인터랙티브 재무모델</title>
<style>
/* Financial Modeling DS — fonts (Outfit for heading, Pretendard for body). 토큰: design-guide/tokens.js */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
*{margin:0;padding:0;box-sizing:border-box}
/* light.bg #FFFFFF, light.surface #F8F8FA, text.light.primary #0F0F12 */
body{font-family:'Pretendard',-apple-system,sans-serif;background:#F8F8FA;color:#0F0F12;overflow:hidden;height:100vh;width:100vw}
canvas#c{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:100;background:#fff;border:1px solid #ddd;border-radius:6px;padding:6px 12px;font-size:11px;color:#666;box-shadow:0 2px 8px rgba(0,0,0,.06);user-select:none}
.top-bar{top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;max-width:calc(100vw - 28px);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.top-bar button{height:26px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:11px;color:#333;padding:0 10px;font-family:'Pretendard',sans-serif;line-height:24px;white-space:nowrap;flex:0 0 auto}
.top-bar button:hover{background:#F3F4F6}
.top-bar .sep{width:1px;height:18px;background:#ddd;flex:0 0 auto}
.top-bar #selLabel{white-space:nowrap;flex:0 0 auto}
#zoom-label{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto}
.legend{bottom:12px;left:12px;font-size:10px;line-height:1.8}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
.hint{bottom:12px;right:12px;font-size:10px;color:#aaa;text-align:right;line-height:1.6}
.popup-overlay{position:fixed;top:0;left:0;right:0;height:100%;transition:right .3s;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.25)}
.popup-overlay.show{display:flex}
.popup{background:#fff;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.15);padding:24px 28px 20px;min-width:520px;max-width:700px;max-height:85vh;overflow-y:auto;position:relative}
.popup-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:#999;padding:4px}
.popup-close:hover{color:#333}
.popup h3{font-size:14px;font-weight:600;margin-bottom:2px;color:#222}
.popup .popup-sub{font-size:11px;color:#999;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 2px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.chart-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.chart-val{font-size:9px;font-family:Arial,sans-serif;color:#555;font-weight:500;text-align:center;white-space:nowrap}
.chart-yr{font-size:9px;font-family:Arial,sans-serif;color:#aaa;text-align:center}
.chart-bar-wrap:hover .chart-val{color:#222;font-weight:700}
.chart-table{width:100%;border-collapse:collapse;margin-top:10px}
.chart-table th{font-size:9px;color:#aaa;font-weight:400;text-align:right;padding:2px 5px;border-bottom:1px solid #eee}
.chart-table td{font-size:10px;font-family:Arial,sans-serif;text-align:right;padding:2px 5px;color:#444}
.chart-table tr:hover td{background:#F8F8FA}
.chart-unit{font-size:9px;color:#bbb;text-align:right;margin-top:3px}
.ds-section{margin-bottom:14px}
.ds-label{font-size:11px;font-weight:600;color:#444;margin-bottom:6px}
.ds-desc{font-size:10px;color:#999;margin-bottom:8px;line-height:1.5}

#right{width:0;overflow:hidden;transition:width .3s;border-left:1px solid #ddd;background:#fff;display:flex;flex-direction:column;flex-shrink:0}
#right.open{width:400px}
.sp-head{padding:10px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sp-head h3{font-size:13px;font-weight:600;flex:1}
.sp-head button{width:24px;height:24px;border:none;background:none;cursor:pointer;font-size:15px;color:#999;border-radius:4px}
.sp-head button:hover{background:#F3F4F6;color:#333}
.sp-body{flex:1;overflow-y:auto;padding:12px 14px}
.sp-sec{font-size:11px;font-weight:600;color:#333;margin:14px 0 6px;padding-bottom:3px}
.sp-row{margin-bottom:10px}
.sp-label{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-bottom:2px}
.sp-label .sp-val{font-family:Arial,sans-serif;font-weight:500;color:#333}
.sp-track{position:relative;height:18px;display:flex;align-items:center}
.sp-track input[type=range]{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:4px;background:#E5E7EB;border-radius:2px;outline:none}
.sp-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#333;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sp-track .sp-mark{position:absolute;top:50%;width:2px;height:10px;background:#5D68F7;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.sp-yrs{display:flex;gap:2px;margin-bottom:10px}
.sp-yr{flex:1;padding:3px 0;font-size:9px;text-align:center;border:1px solid #E5E7EB;border-radius:3px;background:#fff;cursor:pointer;font-family:Arial,sans-serif;color:#888}
.sp-yr.active{background:#333;color:#fff;border-color:#333}
.sp-rst{font-size:9px;color:#5D68F7;cursor:pointer;font-weight:500}
.sp-rst:hover{text-decoration:underline}

#simPanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#333;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* === 노드 편집 UI (Full 모드) === */
/* 컨텍스트 메뉴 */
.ctx-menu{position:fixed;background:#fff;border:1px solid #E5E5E8;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px 0;font-size:12px;z-index:300;min-width:160px;font-family:'Pretendard',sans-serif}
.ctx-menu-item{padding:7px 14px;cursor:pointer;color:#0F0F12;user-select:none}
.ctx-menu-item:hover{background:#F8F8FA}
.ctx-menu-item.danger{color:#DC2626}
.ctx-menu-sep{height:1px;background:#E5E5E8;margin:4px 0}
/* 편집 폼 */
.edit-form label{display:block;font-size:11px;color:#6B7280;margin:12px 0 4px;font-weight:500}
.edit-form input[type=text],.edit-form select,.edit-form textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid #E5E5E8;border-radius:4px;font-family:'Pretendard',sans-serif;background:#fff;color:#0F0F12;outline:none;box-sizing:border-box}
.edit-form input[type=text]:focus,.edit-form textarea:focus,.edit-form select:focus{border-color:#5D68F7}
.edit-form textarea{font-family:Monaco,Consolas,monospace;font-size:12px;min-height:60px;resize:vertical}
.edit-form .hint{font-size:10px;color:#9CA3AF;margin-top:3px}
.edit-form .error{font-size:11px;color:#DC2626;margin-top:8px;padding:8px 10px;background:#FEF2F2;border:1px solid #FECACA;border-radius:4px;display:none}
.edit-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.edit-actions button{padding:7px 14px;font-size:12px;border-radius:4px;border:1px solid #E5E5E8;background:#fff;color:#0F0F12;cursor:pointer;font-family:'Pretendard',sans-serif;font-weight:500}
.edit-actions button:hover{background:#F8F8FA}
.edit-actions button.primary{background:#5D68F7;color:#fff;border-color:#5D68F7}
.edit-actions button.primary:hover{background:#3332D0}
.edit-actions button.danger{color:#DC2626;border-color:#DC2626}
.edit-actions button.danger:hover{background:#FEF2F2}
</style>
</head>
<body style="display:flex;overflow:hidden;height:100vh">
<div id="treePanel" style="flex:1;position:relative;min-width:0;overflow:hidden"><canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<div class="hud top-bar">
  <button onclick="zoomBtn(-1)">−</button><span id="zoom-label">100%</span><button onclick="zoomBtn(1)">+</button>
  <div class="sep"></div>
  <button onclick="toggleAll(true)">모두 펼치기</button>
  <button onclick="toggleAll(false)">모두 접기</button>
  <button onclick="fitAll()">전체 보기</button>
  <div class="sep"></div>
    <div class="sep"></div>
  <button onclick="showAssumptions()" style="background:#F9FAFB;font-weight:500">가정변수</button>
  <button onclick="showRevTable()" style="background:#F9FAFB;font-weight:500">테이블 보기</button>
  <button onclick="toggleSim()" style="background:#5D68F720;font-weight:500;border-color:#5D68F7;color:#3332D0" id="simBtn">시뮬레이터</button>
  <div class="sep"></div>
  <span id="selLabel" style="font-size:10px;color:#9CA3AF;margin-right:4px;font-weight:500">선택 없음</span>
  <button id="btnAddChild" onclick="addUnderSelected()" disabled style="background:#5D68F7;color:#fff;border-color:#5D68F7;font-weight:500" title="선택 노드를 2개 자식의 연산으로 분해 (예: Q = total × share)">분해</button>

</div>
<div class="hud legend">
  <span style="background:#1E2185"></span>매출 <span style="background:#374151"></span>비용 <span style="background:#22C55E"></span>이익<br>
  클릭=펼치기/접기 📊=연도별 수치
</div>
<div class="hud hint">드래그: 이동 / 스크롤: 확대축소<br>노드 우클릭: 편집 · 추가 · 삭제</div>




<div class="popup-overlay" id="revTableOverlay" onclick="if(event.target===this)closeRevTable()" style="display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);position:fixed;top:0;left:0;right:0;height:100%;z-index:200">
  <div class="popup" style="padding:20px 24px;width:90vw;max-width:960px;max-height:90vh;overflow-y:auto">
    <button class="popup-close" onclick="closeRevTable()">✕</button>
    <h3>P&L 테이블</h3>
    <div class="psub" id="revTableSub">시뮬레이션 결과 기반</div>
    <div id="revTableBody"></div>
  </div>
</div>
<div class="popup-overlay" id="popupOverlay" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popup"><button class="popup-close" onclick="closePopup()">✕</button>
    <h3 id="popupTitle"></h3><div class="popup-sub" id="popupSub"></div><div id="popupBody"></div>
  </div>
</div>
<div class="popup-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="popup" id="editPopup" style="min-width:480px;max-width:580px">
    <button class="popup-close" onclick="closeEdit()">✕</button>
    <h3 id="editTitle">노드 편집</h3>
    <div class="popup-sub" id="editSub"></div>
    <div class="edit-form" id="editBody"></div>
  </div>
</div>
<div class="ctx-menu" id="ctxMenu" style="display:none"></div>
<div class="popup-overlay" id="assumOverlay" onclick="if(event.target===this)closeAssum()" style="display:none">
  <div class="popup" id="assumPopup" style="min-width:760px;max-width:920px;max-height:90vh;overflow-y:auto;padding:24px 20px 20px">
    <button class="popup-close" onclick="closeAssum()">✕</button>
    <h3 style="margin-bottom:4px">탑라인 가정변수 일람</h3>
    <div style="font-size:11px;color:#999;margin-bottom:16px">시나리오 분석 시 변경하는 핵심 입력값. 연도별 하드코딩.</div>
    <div id="assumBody"></div>
  </div>
</div>
<div class="popup-overlay" id="varDescOverlay" onclick="if(event.target===this)closeVarDesc()" style="display:none">
  <div class="popup" id="varDescPopup" style="min-width:420px;max-width:640px;max-height:80vh;overflow-y:auto;padding:22px 24px">
    <button class="popup-close" onclick="closeVarDesc()">✕</button>
    <h3 id="varDescTitle" style="margin-bottom:6px">가정 설명</h3>
    <div id="varDescBody"></div>
  </div>
</div>
</div><div id="simPanel" style="width:0;overflow:hidden;transition:width .3s;border-left:1px solid #ddd;background:#fff;display:flex;flex-direction:column;flex-shrink:0"></div>

<script>
// ============================================================
// 케이카 2023 인터랙티브 재무모델
//
// framework/html_modeling_framework.md의 Part II 구현 청사진. 회사별 데이터·트리·계산식을
// 채워 단일 HTML 산출물로 사용. 엔진(렌더링·UI·시뮬레이터·케이스 관리)은
// 그대로 두고 YRS, HIST_N, D만 회사에 맞게 수정한다. DEFAULTS_S, TREE,
// INPUT_KEYS, SIM_SECS, 표, 가정변수표, 기본 simCalc는 D에서 자동 파생된다.
//
// 채워야 할 블록:
//   1. YRS          — 시간축 (실적+추정 연도 배열)
//   2. HIST_N       — 실적 연도 수
//   3. D            — 데이터 객체 (모든 시계열·수식·트리 parent)
// ============================================================

// YRS — 시간축. HIST_N개 연도는 실적(Historical)으로 보고 시뮬레이터에서 잠근다.
// 길이가 모든 D[k].v의 길이와 일치해야 함. 엔진은 YRS.length에 맞춰 자동 동작.
const YRS=['2023', '2024', '2025', '2026', '2027', '2028', '2029'];
const HIST_N=1;
const _isFc=i=>i>=HIST_N;

const D={
  root: {
    label:'KCar Enterprise Value', sub:'채널별 Q × P → FCFF → 밸류에이션',
    parent:null, type:'computed', formula:'enterprise_value',
    v:[0,0,0,0,0,0,0], u:'원', point:1,
    desc:'케이카 재무모델의 최상위 구조. 채널별 중고차 판매 Q×P에서 매출·비용·FCFF·기업가치를 연결.',
    bg:'#0F0F12', fg:'#fff', sfg:'#9CA3AF',
  },
  rev: {
    label:'매출 합계', sub:'중고차 판매 + 부가 매출',
    parent:'root', type:'computed', formula:'SUM(used_car_sales, auction_sales, rental_sales, service_other_sales)',
    v:[0,0,0,0,0,0,0], u:'원', c:'#1E2185',
    desc:'케이카 매출 합계. 이커머스/지점내방 중고차 판매와 경매, 렌터카, 용역/기타 매출을 합산.',
    bg:'#1E2185', fg:'#fff', sfg:'#A1B8FF',
  },
  used_car_sales: {
    label:'중고차 판매', sub:'이커머스 + 지점내방',
    parent:'rev', type:'computed', formula:'ecommerce_sales + branch_sales',
    v:[0,0,0,0,0,0,0], u:'원', c:'#3332D0',
    desc:'핵심 매출원. 채널별·차급별 Q×P 모델로 계산.',
    bg:'#3332D0', fg:'#fff', sfg:'#A1B8FF',
  },
  ecommerce_sales: {
    label:'이커머스 중고차 판매', sub:'차급별 Q × P',
    parent:'used_car_sales', type:'computed', formula:'SUM(ec_suv_rev, ec_large_rev, ec_midsize_rev, ec_compact_rev, ec_small_rev, ec_truck_rev, ec_other_rev)',
    v:[0,0,0,0,0,0,0], u:'원', c:'#5D68F7',
    desc:'온라인 채널 매출. 차급별 시장판매대수, 케이카 점유율, ASP를 곱해 계산.',
    bg:'#EDF3FF', fg:'#1E2185', sfg:'#5D68F7', bdr:'#A1B8FF',
  },
  branch_sales: {
    label:'지점내방 중고차 판매', sub:'차급별 Q × P',
    parent:'used_car_sales', type:'computed', formula:'SUM(br_suv_rev, br_large_rev, br_midsize_rev, br_compact_rev, br_small_rev, br_truck_rev, br_other_rev)',
    v:[0,0,0,0,0,0,0], u:'원', c:'#7C91FD',
    desc:'오프라인 지점 방문 채널 매출. 이커머스와 같은 차급 구조를 사용.',
    bg:'#EDF3FF', fg:'#1E2185', sfg:'#5D68F7', bdr:'#A1B8FF',
  },
  ec_suv_rev: {
    label:'이커머스 SUV', sub:'시장대수 × 점유율 × ASP',
    parent:'ecommerce_sales', type:'computed', formula:'ec_suv_volume * ec_suv_asp',
    v:[0,0,0,0,0,0,0], u:'원', c:'#5D68F7',
    desc:'이커머스 SUV 매출 = 판매대수 × 평균판매가격.',
    bg:'#FFFFFF', fg:'#1E2185', sfg:'#5D68F7', bdr:'#E5E5E8',
  },
  market_suv: {
    label:'SUV 시장판매대수', parent:'ec_suv_volume', type:'input',
    v:[420000,438000,456000,475000,494000,514000,535000], u:'대', c:'#5D68F7',
    desc:'차급별 중고차 시장 판매대수 가정.',
  },
  ec_suv_share: {
    label:'이커머스 SUV 점유율', parent:'ec_suv_volume', type:'input',
    v:[0.018,0.019,0.02,0.021,0.022,0.023,0.024], u:'%', pct:1, c:'#5D68F7',
    desc:'해당 차급 시장에서 케이카 이커머스 채널이 확보하는 비율.',
  },
  ec_suv_volume: {
    label:'이커머스 SUV 판매대수', parent:'ec_suv_rev', type:'computed', formula:'market_suv * ec_suv_share',
    v:[0,0,0,0,0,0,0], u:'대', c:'#7C91FD',
    desc:'이커머스 SUV 판매대수 = 시장판매대수 × 점유율.',
  },
  ec_suv_asp: {
    label:'이커머스 SUV ASP', parent:'ec_suv_rev', type:'input',
    v:[28000000,28504000,29017072,29539379,30071088,30612368,31163390], u:'원/대', c:'#7C91FD',
    desc:'이커머스 SUV 평균판매가격.',
  },
  ec_large_rev: {
    label:'이커머스 대형', sub:'시장대수 × 점유율 × ASP',
    parent:'ecommerce_sales', type:'computed', formula:'ec_large_volume * ec_large_asp',
    v:[0,0,0,0,0,0,0], u:'원', c:'#5D68F7',
    desc:'이커머스 대형 매출 = 판매대수 × 평균판매가격.',
    bg:'#FFFFFF', fg:'#1E2185', sfg:'#5D68F7', bdr:'#E5E5E8',
  },

let INPUT_KEYS=new Set();
let TREE=null;
let SIM_SECS=[];  // 초기 빈 배열, buildSimSecs()이 채움 (선언 순서 의존성 회피)
let ROOT_ID='root';
let REVENUE_ROOT_ID='rev';

function rebuildSemanticIds(){
  ROOT_ID=Object.keys(D).find(k=>D[k].parent==null)||'root';
  REVENUE_ROOT_ID=Object.keys(D).find(k=>D[k].role==='revenue'||D[k].role==='revenue_root')||(D.rev?'rev':ROOT_ID);
}

function rebuildIndexes(){
  rebuildSemanticIds();
  INPUT_KEYS = new Set(Object.keys(D).filter(k=>D[k].type==='input'));
  TREE = buildTree();
  if(typeof buildSimSecs==='function') SIM_SECS = buildSimSecs();
}

// buildTree() — D의 parent 필드를 따라 시각 트리 구성
function buildTree(){
  let childrenOf={};
  for(let k in D){
    let p=D[k].parent;
    if(p==null||!D[p])continue;
    (childrenOf[p]=childrenOf[p]||[]).push(k);
  }
  function makeNode(id){
    let d=D[id]; if(!d)return null;
    let kids=childrenOf[id]||[];
    let n={id, label:d.label, sub:d.sub, data:id};
    if(d.type==='input'){
      n.drv=1;
    } else {
      n.bg=d.bg; n.fg=d.fg; n.sfg=d.sfg; n.bdr=d.bdr;
    }
    if(kids.length) n.children=kids.map(makeNode).filter(x=>x);
    return n;
  }
  return makeNode(ROOT_ID);
}

// 헬퍼: 기존 N()/DR()는 buildTree가 대체. 호환을 위해 stub 유지.
function N(){return null} function DR(){return null}

function treeW_sub(n){if(!n.children||!n.children.length||!openSet.has(n.id))return NW;let maxCW=0;n.children.forEach(c=>{let cw=treeW_sub(c);if(cw>maxCW)maxCW=cw});return NW+GX+maxCW}

function getPos(id){

    if(o){dx+=o.dx;dy+=o.dy}
    cur=parentMap[cur];

}

function fmtSmart(v,pct){
  if(typeof v!=='number'||!isFinite(v)) return '-';
  if(pct) return (v*100).toFixed(1)+'%';
  if(Math.abs(v)>=10) return Math.round(v).toLocaleString('ko-KR');
  return (Math.round(v*100)/100).toLocaleString('ko-KR',{maximumFractionDigits:2});
}
function fmtNum(v,u,pct){
  if(pct) return fmtSmart(v,1);
  if(u==='원'||u==='원/건'||u==='원/대'||u==='원/월'){
    if(Math.abs(v)>=1e12)return(v/1e12).toFixed(1)+'조';
    if(Math.abs(v)>=1e8)return(v/1e8).toFixed(1)+'억';
    if(Math.abs(v)>=1e4)return(v/1e4).toFixed(0)+'만';
  }
  return fmtSmart(v,0);
}
function fmtFull(v,u,pct){return fmtSmart(v,pct)}

let bridgeSelection = []; // stores [yearIdx1, yearIdx2] or [yearIdx1]
let bridgeParentSec = null;
let bridgeBody = null;
let bridgeBarEls = [];

function toggleBridgeInline(body,parentSec,yearIdx,barEl){
  bridgeBody = body;
  bridgeParentSec = parentSec;

  let idx = bridgeSelection.indexOf(yearIdx);
  if(idx !== -1){
    // Deselect
    bridgeSelection.splice(idx, 1);
  } else {
    if(bridgeSelection.length === 0){
      bridgeSelection.push(yearIdx);
    } else if(bridgeSelection.length === 1){
      bridgeSelection.push(yearIdx);
      bridgeSelection.sort((a,b)=>a-b);
    } else {
      // Already 2 selected, replace: keep the other one closest, or just reset
      bridgeSelection = [yearIdx];
    }
  }

  // Update bar highlights
  parentSec.querySelectorAll('.chart-bar-wrap').forEach((w,i)=>{
    if(bridgeSelection.includes(i)){
      w.style.outline='2px solid #333';
      w.style.outlineOffset='2px';
      w.style.borderRadius='4px';
    } else {
      w.style.outline='none';
    }
  });

  // Remove existing bridge
  let existing = document.getElementById('inlineBridge');
  if(existing) existing.remove();

  if(bridgeSelection.length === 0) return;

  let fi, ti;
  if(bridgeSelection.length === 1){
    fi = bridgeSelection[0];
    ti = fi + 1;
    if(ti > 6) { ti = 6; fi = 5; }
  } else {
    fi = bridgeSelection[0];
    ti = bridgeSelection[1];
  }

  renderBridge(fi, ti, parentSec);
}

function renderBridge(fi, ti, parentSec){
  // ============================================================
  // 브릿지(워터폴) 데이터 — 회사별로 채움
  // 매출을 분해하는 BM(사업부)별 시계열 + 합계 시계열.
  // BMS의 합 = TOT 가 매년 일치해야 함.
  // 색상은 DS 토큰 (primary scale + neutrals) 사용 권장.
  // ============================================================
  const BMS={
    '이커머스 중고차':{v:D.ecommerce_sales.v.slice(), c:'#5D68F7'},  // primary.500
    '지점내방 중고차':{v:D.branch_sales.v.slice(), c:'#7C91FD'},      // primary.400
    '경매':{v:D.auction_sales.v.slice(), c:'#3332D0'},                 // primary.700
    '렌터카':{v:D.rental_sales.v.slice(), c:'#A1B8FF'},                // primary.300
    '용역 / 기타':{v:D.service_other_sales.v.slice(), c:'#1E2185'},    // primary.900
  };
  const TOT=(D[REVENUE_ROOT_ID]||D[ROOT_ID]).v.slice();
  const bnames=Object.keys(BMS);
  const bfmt=v=>fmtNum(v,(D[REVENUE_ROOT_ID]&&D[REVENUE_ROOT_ID].u)||'원',0);

  let fromTotal=TOT[fi], toTotal=TOT[ti];
  let deltas=bnames.map(n=>BMS[n].v[ti]-BMS[n].v[fi]);
  let totalDelta=toTotal-fromTotal;

  let bridge=document.createElement('div');
  bridge.id='inlineBridge';
  bridge.style.cssText='margin:16px 0 8px;padding:16px;background:var(--color-background-secondary,#F9FAFB);border-radius:8px;border:0.5px solid var(--color-border-tertiary,#ddd)';

  let title=document.createElement('div');
  title.style.cssText='font-size:12px;font-weight:600;color:var(--color-text-primary,#333);margin-bottom:12px';
  title.textContent=YRS[fi]+'년 → '+YRS[ti]+'년 매출 브릿지  ('+(totalDelta>=0?'+':'')+bfmt(totalDelta)+')';
  bridge.appendChild(title);

  // Canvas
  let canvasWrap=document.createElement('div');
  canvasWrap.style.cssText='position:relative;width:100%;height:260px';
  let cvs=document.createElement('canvas');
  canvasWrap.appendChild(cvs);
  bridge.appendChild(canvasWrap);

  // Table
  let tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;margin-top:8px';
  let thead=document.createElement('tr');
  thead.innerHTML='<th style="text-align:left;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">BM</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">'+YRS[fi]+'</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">'+YRS[ti]+'</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">증감</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">비중</th>';
  tbl.appendChild(thead);
  bnames.forEach((n,i)=>{
    let d=deltas[i];
    let pct=totalDelta!==0?Math.round(d/totalDelta*100):0;
    let dcol=d>=0?BMS[n].c:'#DC2626';
    let tr=document.createElement('tr');
    tr.innerHTML='<td style="font-size:11px;padding:3px 6px;color:#444"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+dcol+';margin-right:6px;vertical-align:middle"></span>'+n+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:#888;font-family:Arial,sans-serif">'+bfmt(BMS[n].v[fi])+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:#888;font-family:Arial,sans-serif">'+bfmt(BMS[n].v[ti])+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:'+(d>=0?'#333':'#DC2626')+';font-family:Arial,sans-serif;font-weight:500">'+(d>=0?'+':'')+bfmt(d)+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:#888;font-family:Arial,sans-serif">'+pct+'%</td>';
    tbl.appendChild(tr);
  });
  let totRow=document.createElement('tr');
  totRow.innerHTML='<td style="font-size:11px;padding:5px 6px;color:#222;font-weight:600;border-top:1px solid #ddd">합계</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#222;font-weight:600;border-top:1px solid #ddd;font-family:Arial,sans-serif">'+bfmt(fromTotal)+'</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#222;font-weight:600;border-top:1px solid #ddd;font-family:Arial,sans-serif">'+bfmt(toTotal)+'</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#222;font-weight:600;border-top:1px solid #ddd;font-family:Arial,sans-serif">'+(totalDelta>=0?'+':'')+bfmt(totalDelta)+'</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#888;border-top:1px solid #ddd;font-family:Arial,sans-serif">100%</td>';
  tbl.appendChild(totRow);
  bridge.appendChild(tbl);

  parentSec.parentNode.insertBefore(bridge,parentSec.nextSibling);

  // Build waterfall items
  let items=[];
  items.push({label:YRS[fi].slice(2)+'년',val:fromTotal,color:'#1E2185',isTotal:true});
  let running=fromTotal;
  bnames.forEach((n,i)=>{
    let d=deltas[i];
    if(Math.abs(d)<1)return;
    items.push({label:n,val:d,color:d>=0?BMS[n].c:'#DC2626',isTotal:false,base:d>=0?running:running+d});
    running+=d;
  });
  items.push({label:YRS[ti].slice(2)+'년',val:toTotal,color:'#1E2185',isTotal:true});

  setTimeout(()=>{
    let labels_b=items.map(it=>it.label);
    let bases_b=items.map(it=>it.isTotal?0:it.base);
    let tops_b=items.map(it=>it.isTotal?it.val:Math.abs(it.val));
    let colors_b=items.map(it=>it.color);

    new Chart(cvs,{
      type:'bar',
      data:{labels:labels_b,datasets:[
        {data:bases_b,backgroundColor:items.map(()=>'transparent'),borderWidth:0,barPercentage:.65},
        {data:tops_b,backgroundColor:colors_b,borderWidth:0,barPercentage:.65,borderRadius:{topLeft:3,topRight:3}},
      ]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{enabled:false}},
        scales:{
          x:{stacked:true,grid:{display:false},ticks:{font:{size:10}}},
          y:{stacked:true,display:false}
        },
        animation:{duration:300},layout:{padding:{top:20}}
      },
      plugins:[{
        id:'vl2',afterDraw(ch){
          let ctx2=ch.ctx,meta=ch.getDatasetMeta(1);ctx2.save();
          meta.data.forEach((bar,i)=>{
            let v=tops_b[i];if(!v||v<1e6)return;
            let isT=items[i].isTotal;
            let dispV=isT?v:items[i].val;
            ctx2.font=(isT?'600':'400')+' 10px Arial,sans-serif';
            ctx2.textAlign='center';ctx2.fillStyle=isT?'#222':'#666';
            ctx2.fillText(bfmt(dispV),bar.x,bar.y-5)});
          ctx2.restore()}
      }]
    });
  },50);
}

function closeRevTable(){document.getElementById('revTableOverlay').style.display='none'}
function showRevTable(){
  let body=document.getElementById('revTableBody');body.innerHTML='';
  let fW=function(v){let a=Math.abs(v),s=v<0?'-':'';if(a>=1e12)return s+(a/1e12).toFixed(1)+'조';if(a>=1e8)return s+(a/1e8).toFixed(0)+'억';if(a>=1e6)return s+(a/1e6).toFixed(0)+'백만';return Math.round(v).toLocaleString()};
  let tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse';
  let th=document.createElement('tr');
  th.innerHTML='<th style="text-align:left;font-size:10px;color:#aaa;font-weight:400;padding:6px 8px;border-bottom:1px solid #ddd;width:200px">항목</th>'+YRS.map(y=>'<th style="text-align:right;font-size:10px;color:#aaa;font-weight:400;padding:6px 8px;border-bottom:1px solid #ddd">'+y+'</th>').join('');
  tbl.appendChild(th);

  let _tblCollapsed=new Set();

  function row(label,key,indent,bold,color,parentGroup){
    let vals=D[key]?D[key].v:[];if(!vals.length)return;
    let isPct=D[key]&&D[key].pct;
    let tr=document.createElement('tr');
    tr.style.borderBottom='0.5px solid #F9FAFB';
    if(bold)tr.style.background='#F9FAFB';
    if(parentGroup)tr.dataset.group=parentGroup;
    let pl=indent*16;
    // Toggleable parent rows
    let isParent=bold&&indent===0;
    let toggleId=key;
    let c='<td style="padding:5px 8px 5px '+(8+pl)+'px;font-size:11px;color:'+(color||'#333')+';font-weight:'+(bold?'600':'400')+';cursor:'+(isParent?'pointer':'default')+';white-space:nowrap">';
    if(isParent)c+='<span class="_tgl" data-g="'+toggleId+'" style="display:inline-block;width:14px;font-size:9px;color:#aaa">▼</span>';
    c+=label+'</td>';
    vals.forEach(v=>{
      c+='<td style="text-align:right;padding:5px 8px;font-size:11px;font-family:Arial,sans-serif;color:'+(color||'#444')+';font-weight:'+(bold?'600':'400')+'">'+(isPct?(v*100).toFixed(1)+'%':fW(v))+'</td>';
    });
    tr.innerHTML=c;
    if(isParent){
      tr.style.cursor='pointer';
      tr.onclick=function(){
        if(_tblCollapsed.has(toggleId)){_tblCollapsed.delete(toggleId)}else{_tblCollapsed.add(toggleId)}
        // Toggle visibility of child rows
        let rows=tbl.querySelectorAll('tr[data-group="'+toggleId+'"]');
        rows.forEach(r=>r.style.display=_tblCollapsed.has(toggleId)?'none':'');
        // Toggle arrow
        let arrow=this.querySelector('._tgl');
        if(arrow)arrow.textContent=_tblCollapsed.has(toggleId)?'▶':'▼';
      };
    }
    tbl.appendChild(tr);
  }
  function spacer(){let sp=document.createElement('tr');sp.innerHTML='<td colspan="8" style="height:4px"></td>';tbl.appendChild(sp)}
  function bigSpacer(){let sp=document.createElement('tr');sp.innerHTML='<td colspan="8" style="height:12px;border-top:2px solid #ddd"></td>';tbl.appendChild(sp)}

  // ========== P&L 테이블 행 — D 트리에서 자동 생성 ==========
  // root의 자식들이 top-level (bold), 그 아래는 indent 증가
  function _walkPL(id, indent, parentGroup){
    let d=D[id]; if(!d) return;
    let isTop=indent===0;
    let color = isTop ? (d.bg && d.bg!=='#fff' ? d.bg : null) : '#6B7280';
    row(d.label, id, indent, isTop, color, parentGroup);
    let kids=Object.keys(D).filter(k=>D[k].parent===id);
    let nextGroup=isTop?id:parentGroup;
    kids.forEach(k=>_walkPL(k, indent+1, nextGroup));
  }
  let _topItems=Object.keys(D).filter(k=>D[k].parent==='root');
  _topItems.forEach((id, i)=>{
    if(i>0) bigSpacer();
    _walkPL(id, 0, null);
  });

  body.appendChild(tbl);

  let note=document.createElement('div');note.style.cssText='font-size:9px;color:#aaa;margin-top:12px';
  let nChanged=0;for(let k in DEFAULTS_S)for(let i=0;i<YRS.length;i++)if(Math.abs(SV[k][i]-DEFAULTS_S[k][i])>1e-8)nChanged++;
  note.textContent=nChanged>0?'시뮬레이션 적용 ('+nChanged+'개 변수 변경됨)':'기본값 기준';
  body.appendChild(note);

  let el=document.getElementById('revTableOverlay');
  el.style.right=(document.getElementById('simPanel').offsetWidth||0)+'px';
  el.style.display='flex';
}

// ============ INTERACTION ============
function s2w(sx,sy){return{x:(sx-cam.x)/cam.s,y:(sy-cam.y)/cam.s}}
function hitTest(sx,sy){let w=s2w(sx,sy);for(let i=allNodes.length-1;i>=0;i--){let n=allNodes[i],p=getPos(n.id);if(!p)continue;if(w.x>=p.x&&w.x<=p.x+p.w&&w.y>=p.y&&w.y<=p.y+p.h){let inChart=n.data&&D[n.data]&&w.x>=p.x+p.w-ICON_W&&w.y<=p.y+24;return{node:n,isChart:inChart}}}return null}
function canToggle(n){return n.children&&n.children.length>0}
let drag=false,dragStart={x:0,y:0},camStart={x:0,y:0},clickStart=null;
let nodeDrag=null; // {nodeId, startX, startY}
let nodeOffsets={}; // {nodeId: {dx, dy}}
cvs=document.getElementById('c');ctx=cvs.getContext('2d');
function resize(){let _tp=document.getElementById("treePanel");W=_tp?_tp.clientWidth:window.innerWidth;H=_tp?_tp.clientHeight:window.innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';renderAll()}
window.addEventListener('resize',resize);
cvs.addEventListener('pointerdown',e=>{
  clickStart={x:e.clientX,y:e.clientY,t:Date.now()};
  cvs.setPointerCapture(e.pointerId);
  let hit=hitTest(e.clientX,e.clientY);
  if(hit&&!hit.isChart){
    // Potential node drag - don't start yet, wait for movement threshold
    let w=s2w(e.clientX,e.clientY);
    let p=getPos(hit.node.id);
    nodeDrag={id:hit.node.id,ox:w.x-p.x,oy:w.y-p.y,active:false};
    drag=false;
  } else {
    nodeDrag=null;
    drag=true;dragStart={x:e.clientX,y:e.clientY};camStart={x:cam.x,y:cam.y};
  }
});
cvs.addEventListener('pointermove',e=>{
  if(nodeDrag){
    let dist=Math.abs(e.clientX-clickStart.x)+Math.abs(e.clientY-clickStart.y);
    if(!nodeDrag.active&&dist<8)return; // threshold not met, wait
    nodeDrag.active=true; // now it's a real drag
    cvs.style.cursor='grabbing';
    let w=s2w(e.clientX,e.clientY);
    let baseP=positions[nodeDrag.id];
    if(baseP){
      // Only update THIS node's offset. Children inherit via getPos ancestor chain.
      // But we need to account for ancestor offsets when computing the target
      let ancestorDx=0,ancestorDy=0,cur=parentMap[nodeDrag.id];
      while(cur){let o=nodeOffsets[cur];if(o){ancestorDx+=o.dx;ancestorDy+=o.dy}cur=parentMap[cur]}
      if(!nodeOffsets[nodeDrag.id])nodeOffsets[nodeDrag.id]={dx:0,dy:0};
      nodeOffsets[nodeDrag.id].dx=w.x-nodeDrag.ox-baseP.x-ancestorDx;
      nodeOffsets[nodeDrag.id].dy=w.y-nodeDrag.oy-baseP.y-ancestorDy;
      renderAll();
    }
    return;
  }
  if(drag){cam.x=camStart.x+(e.clientX-dragStart.x);cam.y=camStart.y+(e.clientY-dragStart.y);renderAll()}
  let hit=hitTest(e.clientX,e.clientY);
  let nh=hit?hit.node.id:null;let nc=hit&&hit.isChart?hit.node.id:null;
  if(nh!==hoverId||nc!==hoverChart){hoverId=nh;hoverChart=nc;cvs.style.cursor=nc?'pointer':(nh?'grab':'default');renderAll()}
});
cvs.addEventListener('pointerup',e=>{

      selectedId=null;

    }
  }
  clickStart=null;
});

function zoomBtn(d){let ns=cam.s*(d>0?1.15:1/1.15);ns=Math.max(0.15,Math.min(4,ns));let cx=W/2,cy=H/2,wx=(cx-cam.x)/cam.s,wy=(cy-cam.y)/cam.s;cam.s=ns;cam.x=cx-wx*cam.s;cam.y=cy-wy*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()}
function fitAll(){nodeOffsets={};allNodes=[];positions={};doLayout(TREE,PAD,PAD);let minX=1e9,minY=1e9,maxX=0,maxY=0;Object.values(positions).forEach(p=>{if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;if(p.x+p.w>maxX)maxX=p.x+p.w;if(p.y+p.h>maxY)maxY=p.y+p.h});maxX+=40;maxY+=40;let tw=maxX-minX+PAD*2,th=maxY-minY+PAD*2;cam.s=Math.min(W/tw,H/th,2)*.9;cam.x=W/2-(minX+maxX)/2*cam.s;cam.y=H/2-(minY+maxY)/2*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()}
function toggleAll(open){nodeOffsets={};function walk(n){if(canToggle(n)){if(open)openSet.add(n.id);else if(n.id!==ROOT_ID&&n.id!==REVENUE_ROOT_ID)openSet.delete(n.id)}if(n.children)n.children.forEach(walk)}walk(TREE);if(!open){openSet.add(ROOT_ID);openSet.add(REVENUE_ROOT_ID)}fitAll()}

function _parseDesc(desc){
  let raw=String(desc||'').trim();
  let tag='기타';
  let m=raw.match(/^\[([^\]]+)\]\s*/);
  if(m){tag=m[1];raw=raw.slice(m[0].length).trim()}
  let bullets=raw?raw.split(/(?<=\.)\s+/).map(s=>s.trim()).filter(Boolean):['설명이 입력되지 않았음.'];
  return {tag,bullets};
}
function showVarDesc(key){
  let d=D[key]; if(!d)return;

  let tagColor=parsed.tag.includes('객관')?'#6B7280':parsed.tag.includes('주관')?'#3332D0':'#8A5A2F';

    '<ul style="margin:0;padding-left:18px;color:#444;font-size:13px;line-height:1.7">'+parsed.bullets.map(b=>'<li>'+b.replace(/[&<>]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]))+'</li>').join('')+'</ul>';

  d.label=label;
  d.type=type;

  d.u=unit||'원';
  d.desc=desc;

function applyDecompEdit(id){
  let d=D[id]; if(!d) return;
  let label=document.getElementById('_e_label').value.trim();
  let formula=document.getElementById('_e_formula').value.trim();
  let unit=document.getElementById('_e_unit').value.trim();
  let desc=document.getElementById('_e_desc').value.trim();
  if(!label){ _editErr('_e_err','표시명 필수'); return; }
  if(!formula){ _editErr('_e_err','수식 필수'); return; }

  // 기존 자식 검증
  for(let c of _editExisting){
    if(!c.deleted && !c.label){ _editErr('_e_err','자식 "'+c.id+'" 표시명 필수'); return; }
  }
  // 새 자식 검증
  let rx=/^[a-zA-Z_][a-zA-Z_0-9]*$/;
  let allIds=new Set(Object.keys(D));
  _editExisting.filter(c=>c.deleted).forEach(c=>allIds.delete(c.id));
  for(let i=0;i<_editNew.length;i++){
    let c=_editNew[i];
    if(!c.id){ _editErr('_e_err','새 자식 '+(i+1)+': ID 필수'); return; }
    if(!rx.test(c.id)){ _editErr('_e_err','새 자식 '+(i+1)+': ID 형식 오류 ('+c.id+')'); return; }
    if(allIds.has(c.id)){ _editErr('_e_err','이미 존재하는 ID: '+c.id); return; }
    if(!c.label){ _editErr('_e_err','새 자식 '+(i+1)+': 표시명 필수'); return; }
    allIds.add(c.id);
  }

  // 수식 검증
  let ast;
  try{ ast=parseFormula(formula); } catch(e){ _editErr('_e_err','수식: '+e.message); return; }
  let deps=extractDeps(ast);
  for(let dep of deps){
    if(!allIds.has(dep)){ _editErr('_e_err','미정의 변수 참조: '+dep); return; }
  }

  // 적용 — 기존 자식 업데이트
  for(let c of _editExisting){
    if(c.deleted){
      // cascade 삭제
      function _cascade(k){
        Object.keys(D).filter(x=>D[x].parent===k).forEach(_cascade);
        delete D[k]; delete SV[k]; delete DEFAULTS_S[k];
      }
      _cascade(c.id);
    } else {
      let cd=D[c.id];
      if(cd){ cd.label=c.label; cd.u=c.unit||'원'; }
    }
  }
  // 새 자식 생성 (모두 input)
  let palette=['#5D68F7','#7C91FD','#A1B8FF','#9CA3AF','#6B7280','#3332D0'];
  let existingKidCount=_editExisting.filter(c=>!c.deleted).length;
  _editNew.forEach((c,i)=>{
    let arr=Array(YRS.length).fill(c.val);
    D[c.id]={label:c.label, parent:id, type:'input', v:arr, u:c.unit||'원', desc:'', c:palette[(existingKidCount+i)%palette.length]};
    SV[c.id]=arr.slice(); DEFAULTS_S[c.id]=arr.slice();
  });
  // 부모 업데이트
  d.label=label;
  d.formula=formula;
  d.sub=formula;
  d.u=unit||'원';
  d.desc=desc;
  d.type='computed';
  _afterEdit();
}

function applyAddChild(parentId){
  let formula=document.getElementById('_a_formula').value.trim();
  if(!formula){ _editErr('_a_err','수식 필수'); return; }

  // 자식 유효성 검사
  let rx=/^[a-zA-Z_][a-zA-Z_0-9]*$/;
  if(_decompChildren.length<1){ _editErr('_a_err','자식이 최소 1개 필요'); return; }
  let seen=new Set();
  for(let i=0;i<_decompChildren.length;i++){
    let c=_decompChildren[i];
    if(!c.id){ _editErr('_a_err','자식 '+(i+1)+': ID 필수'); return; }
    if(!rx.test(c.id)){ _editErr('_a_err','자식 '+(i+1)+': ID 형식 오류 ('+c.id+')'); return; }
    if(D[c.id]){ _editErr('_a_err','이미 존재하는 ID: '+c.id); return; }
    if(seen.has(c.id)){ _editErr('_a_err','중복 ID: '+c.id); return; }
    if(!c.label){ _editErr('_a_err','자식 '+(i+1)+': 표시명 필수'); return; }
    seen.add(c.id);
  }

  // 수식 검증 — syntax + 변수 참조 (새 자식 또는 기존 노드)
  let ast;
  try{ ast=parseFormula(formula); } catch(e){ _editErr('_a_err','수식 파싱: '+e.message); return; }
  let deps=extractDeps(ast);
  for(let dep of deps){
    if(!D[dep] && !seen.has(dep)){
      _editErr('_a_err','미정의 변수 참조: '+dep+' (자식으로 추가하거나 오타 확인)');
      return;
    }
  }

  // 자식 생성 (모두 input)
  let palette=['#5D68F7','#7C91FD','#A1B8FF','#9CA3AF','#6B7280','#3332D0'];

    D[c.id]={label:c.label, parent:parentId, type:'input', v:arr, u:c.unit||'원', desc:'', c:palette[i%palette.length]};
    SV[c.id]=arr.slice();
    DEFAULTS_S[c.id]=arr.slice();
  });

  // 부모를 computed로 전환
  let p=D[parentId];
  p.type='computed';
  p.formula=formula;
  p.sub=formula;
  if(!p.bg){ p.bg='#F9FAFB'; p.fg='#374151'; p.sfg='#6B7280'; p.bdr='#D1D5DB'; }
  delete SV[parentId]; delete DEFAULTS_S[parentId];

  _afterEdit();

function deleteNodeUI(id){

  if(kids.length) msg+='\n자식 '+kids.length+'개도 함께 삭제';

function _stableJson(v){
  if(Array.isArray(v)) return '['+v.map(_stableJson).join(',')+']';
  if(v&&typeof v==='object'){
    return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+_stableJson(v[k])).join(',')+'}';
  }
  return JSON.stringify(v);
}
function _hashString(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return (h>>>0).toString(36);
}

// ============================================================
// SIMULATION ENGINE + SIDE PANEL
// ============================================================
// ============================================================
// DEFAULTS_S — 입력 변수의 기본값
// SV (현재 슬라이더 상태)와 비교 기준. 슬라이더의 주황색 마크 위치.
// "기본값" 버튼은 SV ← DEFAULTS_S 복사.
//
// D의 input 노드 v에서 자동 추출한다. 이중 입력으로 인한 불일치를 막기 위해
// 별도 DEFAULTS_S 객체를 수기로 작성하지 않음.
// ============================================================
function deriveDefaultsFromD(){
  let out={};
  for(let k in D){
    if(D[k].type==='input'){
      let arr=(D[k].v||[]).slice();
      while(arr.length<YRS.length) arr.push(0);
      arr.length=YRS.length;
      out[k]=arr;
    }
  }
  return out;
}
const DEFAULTS_S=deriveDefaultsFromD();

let SV={},SR={};for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();

// ============================================================
// 수식 엔진 (Full 모드 — 동적 노드 편집)
//
// 흐름:
//   1) D[k].formula 문자열 → tokenize → parse → AST (캐시)
//   2) AST에서 의존 변수 추출 (캐시)
//   3) 토폴로지 정렬로 평가 순서 결정 (순환참조 검출)
//   4) 순서대로 evalAst → D[k].v 갱신
//
// 수식 문법:
//   산술:       + - * /  (괄호 지원)
//   비교:       == != < > <= >=
//   함수:       SUM(a,b,..)  MIN/MAX/AVG  IF(c,t,e)  PREV(x)
//   변수 참조:  다른 노드의 id (e.g. unit_q)
//   값은 모두 길이 YRS.length 배열, 연도별 element-wise 평가.
// ============================================================

// ----- Tokenizer -----
function tokenize(s){
  let i=0, t=[];
  while(i<s.length){
    let c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/\d/.test(c) || (c==='.' && /\d/.test(s[i+1]))){
      let m=s.slice(i).match(/^\d*\.?\d+([eE][-+]?\d+)?/);
      t.push({type:'num',val:parseFloat(m[0])}); i+=m[0].length; continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let m=s.slice(i).match(/^[a-zA-Z_][a-zA-Z_0-9]*/);
      t.push({type:'ident',val:m[0]}); i+=m[0].length; continue;
    }
    if('+-*/(),'.includes(c)){ t.push({type:'op',val:c}); i++; continue; }
    if((c==='='||c==='!') && s[i+1]==='='){ t.push({type:'cmp',val:c+'='}); i+=2; continue; }
    if(c==='<'||c==='>'){
      if(s[i+1]==='='){ t.push({type:'cmp',val:c+'='}); i+=2; }
      else { t.push({type:'cmp',val:c}); i++; }
      continue;
    }
    throw new Error('알 수 없는 문자: '+c);
  }
  return t;
}

// ----- Parser (recursive descent) -----
function parseFormula(s){
  let tokens=tokenize(s), pos=0;
  function peek(){ return tokens[pos]; }
  function eat(type,val){
    let tk=tokens[pos];
    if(!tk||tk.type!==type||(val!==undefined&&tk.val!==val))
      throw new Error('파싱 오류: "'+(tk?tk.val:'끝')+'" — '+(val||type)+' 기대');
    pos++; return tk;
  }
  function parseExpr(){ return parseCmp(); }
  function parseCmp(){
    let l=parseSum();
    while(peek()&&peek().type==='cmp'){
      let op=eat('cmp').val, r=parseSum();
      l={kind:'cmp',op,l,r};
    }
    return l;
  }
  function parseSum(){
    let l=parseTerm();
    while(peek()&&(peek().val==='+'||peek().val==='-')){
      let op=eat('op').val, r=parseTerm();
      l={kind:'bin',op,l,r};
    }
    return l;
  }
  function parseTerm(){
    let l=parseFactor();
    while(peek()&&(peek().val==='*'||peek().val==='/')){
      let op=eat('op').val, r=parseFactor();
      l={kind:'bin',op,l,r};
    }
    return l;
  }
  function parseFactor(){
    let t=peek();
    if(!t) throw new Error('수식이 비어있음');
    if(t.val==='-'){ eat('op'); return {kind:'neg',x:parseFactor()}; }
    if(t.val==='('){ eat('op','('); let e=parseExpr(); eat('op',')'); return e; }
    if(t.type==='num'){ eat('num'); return {kind:'num',val:t.val}; }
    if(t.type==='ident'){
      eat('ident');
      if(peek()&&peek().val==='('){
        eat('op','(');
        let args=[];
        if(peek()&&peek().val!==')'){
          args.push(parseExpr());
          while(peek()&&peek().val===','){ eat('op'); args.push(parseExpr()); }
        }
        eat('op',')');
        return {kind:'fn',name:t.val,args};
      }
      return {kind:'ref',name:t.val};
    }
    throw new Error('파싱 오류: 예기치 못한 토큰 "'+t.val+'"');
  }
  let ast=parseExpr();
  if(peek()) throw new Error('수식 뒤에 잉여 토큰: "'+peek().val+'"');
  return ast;
}

// ----- 의존 변수 추출 -----
function extractDeps(ast, set){
  if(!set) set=new Set();
  if(!ast) return set;
  if(ast.kind==='ref') set.add(ast.name);
  if(ast.l) extractDeps(ast.l,set);
  if(ast.r) extractDeps(ast.r,set);
  if(ast.x) extractDeps(ast.x,set);
  if(ast.args) ast.args.forEach(a=>extractDeps(a,set));
  return set;
}

function evalAstAt(ast, env, i, ctx){
  switch(ast.kind){
    case 'num': return ast.val;
    case 'ref': {
      if(ctx&&ast.name===ctx.self&&ctx.out&&ctx.out[i]!==undefined) return ctx.out[i];
      let v=env[ast.name];
      if(v===undefined) throw new Error('미정의 변수: '+ast.name);
      return Number(v[i])||0;
    }
    case 'neg': return -evalAstAt(ast.x,env,i,ctx);
    case 'bin': {
      let x=evalAstAt(ast.l,env,i,ctx), y=evalAstAt(ast.r,env,i,ctx);
      if(ast.op==='+') return x+y;
      if(ast.op==='-') return x-y;
      if(ast.op==='*') return x*y;
      if(ast.op==='/') return y===0?0:x/y;
      return 0;
    }
    case 'cmp': {
      let x=evalAstAt(ast.l,env,i,ctx), y=evalAstAt(ast.r,env,i,ctx);
      if(ast.op==='==') return x===y?1:0;
      if(ast.op==='!=') return x!==y?1:0;
      if(ast.op==='<') return x<y?1:0;
      if(ast.op==='>') return x>y?1:0;
      if(ast.op==='<=') return x<=y?1:0;
      if(ast.op==='>=') return x>=y?1:0;
      return 0;
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(fn==='PREV'){
        if(ast.args.length!==1) throw new Error('PREV는 1개 인자 필요');
        if(i===0) return 0;
        if(ast.args[0].kind==='ref'&&ctx&&ast.args[0].name===ctx.self) return ctx.out[i-1]||0;
        return evalAstAt(ast.args[0],env,i-1,ctx);
      }
      let args=ast.args.map(a=>evalAstAt(a,env,i,ctx));
      if(fn==='SUM') return args.reduce((s,a)=>s+a,0);
      if(fn==='MIN') return Math.min(...args);
      if(fn==='MAX') return Math.max(...args);
      if(fn==='AVG') return args.reduce((s,a)=>s+a,0)/args.length;
      if(fn==='IF'){
        if(ast.args.length!==3) throw new Error('IF는 3개 인자 필요');
        return evalAstAt(ast.args[0],env,i,ctx)?evalAstAt(ast.args[1],env,i,ctx):evalAstAt(ast.args[2],env,i,ctx);
      }
      if(fn==='SUMALL'){
        return ast.args.reduce((sum,arg)=>{
          let arr=evalAst(arg,env);
          return sum+arr.reduce((s,v)=>s+(Number(v)||0),0);
        },0);
      }
      if(fn==='LAST') return evalAst(ast.args[0],env)[YRS.length-1]||0;
      if(fn==='FIRST') return evalAst(ast.args[0],env)[0]||0;
      throw new Error('미정의 함수: '+ast.name);
    }
  }
  throw new Error('알 수 없는 AST');
}

function evalAstYears(ast, env, selfKey){
  let out=[];
  let ctx={self:selfKey,out};
  for(let i=0;i<YRS.length;i++) out[i]=evalAstAt(ast,env,i,ctx);
  return out;
}

// ----- 평가 (element-wise on length YRS.length) -----
function evalAst(ast, env){
  let N=YRS.length;
  switch(ast.kind){
    case 'num': return Array(N).fill(ast.val);
    case 'ref': {
      let v=env[ast.name];
      if(v===undefined) throw new Error('미정의 변수: '+ast.name);
      return v.slice();
    }
    case 'neg': return evalAst(ast.x,env).map(v=>-v);
    case 'bin': {
      let a=evalAst(ast.l,env), b=evalAst(ast.r,env);
      return a.map((x,i)=>{
        let y=b[i];
        switch(ast.op){
          case '+': return x+y;
          case '-': return x-y;
          case '*': return x*y;
          case '/': return y===0?0:x/y;
        }
      });
    }
    case 'cmp': {
      let a=evalAst(ast.l,env), b=evalAst(ast.r,env);
      return a.map((x,i)=>{
        let y=b[i];
        switch(ast.op){
          case '==': return x===y?1:0;
          case '!=': return x!==y?1:0;
          case '<':  return x<y?1:0;
          case '>':  return x>y?1:0;
          case '<=': return x<=y?1:0;
          case '>=': return x>=y?1:0;
        }
      });
    }
    case 'fn': {
      let args=ast.args.map(a=>evalAst(a,env));
      let fn=ast.name.toUpperCase();
      switch(fn){
        case 'SUM':  return Array(N).fill(0).map((_,i)=>args.reduce((s,a)=>s+a[i],0));
        case 'MIN':  return Array(N).fill(0).map((_,i)=>Math.min(...args.map(a=>a[i])));
        case 'MAX':  return Array(N).fill(0).map((_,i)=>Math.max(...args.map(a=>a[i])));
        case 'AVG':  return Array(N).fill(0).map((_,i)=>args.reduce((s,a)=>s+a[i],0)/args.length);
        case 'SUMALL': return Array(N).fill(args.reduce((s,a)=>s+a.reduce((x,y)=>x+(Number(y)||0),0),0));
        case 'LAST': return Array(N).fill(args[0][N-1]||0);
        case 'FIRST': return Array(N).fill(args[0][0]||0);
        case 'IF':
          if(args.length!==3) throw new Error('IF는 3개 인자 필요');
          return Array(N).fill(0).map((_,i)=>args[0][i]?args[1][i]:args[2][i]);
        case 'PREV':
          if(args.length!==1) throw new Error('PREV는 1개 인자 필요');
          return Array(N).fill(0).map((_,i)=>i===0?0:args[0][i-1]);
        default: throw new Error('미정의 함수: '+ast.name);
      }
    }
  }
  throw new Error('알 수 없는 AST');
}

// ----- 토폴로지 정렬 -----
function topoSort(){
  let order=[], visited=new Set(), visiting=new Set();
  function visit(k, path){
    if(visited.has(k)) return;
    if(visiting.has(k)){
      throw new Error('순환 참조: '+[...path,k].join(' → '));
    }
    visiting.add(k);
    let d=D[k];
    if(d && d.type==='computed' && d.formula){
      try{
        if(!d._ast) d._ast=parseFormula(d.formula);
        if(!d._deps){ d._deps=extractDeps(d._ast); d._deps.delete(k); }
        for(let dep of d._deps){
          if(D[dep]) visit(dep, [...path, k]);
        }
        d._error=null;
      } catch(e){
        d._error=e.message;
      }
    }
    visiting.delete(k);
    visited.add(k);
    order.push(k);
  }
  for(let k in D){
    try{ visit(k, []); } catch(e){ if(D[k]) D[k]._error=e.message; }
  }
  return order;
}

// ----- 메인 simCalc (generic evaluator) -----
function simCalc(){
  let order=topoSort();
  let env={};
  // 입력값: SV → env, D.v
  for(let k in D){
    if(D[k].type==='input'){
      let v=(SV[k]||D[k].v||[]).slice();
      // YRS 길이에 맞추기
      while(v.length<YRS.length) v.push(0);
      v.length=YRS.length;
      env[k]=v;
      D[k].v=v;
    }
  }
  // 평가 순서대로 computed 노드 계산
  for(let k of order){
    let d=D[k];
    if(!d||d.type!=='computed') continue;
    if(!d._ast){
      // 파싱 실패 — 이전 값 유지
      continue;
    }
    try{
      let v=evalAstYears(d._ast, env, k);
      env[k]=v;
      d.v=v;
      d._error=null;
    } catch(e){
      d._error=e.message;
      env[k]=d.v;  // 이전 값 유지
    }
  }
  // 변경 자동 저장 (debounced 300ms)
  if(typeof saveToStorage==='function') saveToStorage();
}

// 캐시 무효화 — formula·D 구조 변경 시 호출
function clearFormulaCache(){
  for(let k in D){
    delete D[k]._ast;
    delete D[k]._deps;
  }
}

// ============================================================
// 엑셀 다운로드 — 수식 그대로 박힌 .xlsx 생성 (SheetJS 사용)
//
// 레이아웃:
//   A: Variable ID  |  B: Label  |  C: Unit  |  D..: 연도별 값/수식
//   - input 노드: 값 리터럴
//   - computed 노드: Excel formula (변수 참조 = 해당 변수 행의 같은 연도 열)
// ============================================================
function _colLetter(idx){
  // 0=A, 25=Z, 26=AA, ...
  let r=''; let n=idx;
  while(n>=0){ r=String.fromCharCode(65+n%26)+r; n=Math.floor(n/26)-1; }
  return r;
}

function astToExcel(ast, year, rowMap){
  function _ref(name, yr){
    let row=rowMap[name];
    if(!row) throw new Error('미정의 변수: '+name);
    return _colLetter(3+yr)+row;  // D=0, E=1, ...
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return _ref(ast.name, year);
    case 'neg': return '(-'+astToExcel(ast.x, year, rowMap)+')';
    case 'bin': {
      let l=astToExcel(ast.l, year, rowMap);
      let r=astToExcel(ast.r, year, rowMap);
      return '('+l+ast.op+r+')';
    }
    case 'cmp': {
      let l=astToExcel(ast.l, year, rowMap);
      let r=astToExcel(ast.r, year, rowMap);
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+l+op+r+')';
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(['SUMALL','LAST','FIRST'].includes(fn)){
        if(ast.args.length!==1||ast.args[0].kind!=='ref') throw new Error(fn+'는 변수 참조 1개만 지원');
        let row=rowMap[ast.args[0].name];
        if(!row) throw new Error('미정의 변수: '+ast.args[0].name);
        if(fn==='SUMALL') return 'SUM('+_colLetter(3)+row+':'+_colLetter(3+YRS.length-1)+row+')';
        if(fn==='LAST') return _colLetter(3+YRS.length-1)+row;
        if(fn==='FIRST') return _colLetter(3)+row;
      }
      let args=ast.args.map(a=>astToExcel(a, year, rowMap));
      switch(fn){
        case 'SUM': return 'SUM('+args.join(',')+')';
        case 'MIN': return 'MIN('+args.join(',')+')';
        case 'MAX': return 'MAX('+args.join(',')+')';
        case 'AVG': return 'AVERAGE('+args.join(',')+')';
        case 'IF':  return 'IF('+args[0]+','+args[1]+','+args[2]+')';
        case 'PREV': {
          if(year===0) return '0';
          let inner=ast.args[0];
          if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
          return _ref(inner.name, year-1);
        }
        default: throw new Error('미지 함수: '+fn);
      }
    }
  }
  throw new Error('AST 변환 실패');
}

// 보조 JSON 내보내기
function exportToJSON(){
  let payload={
    version: 1,
    YRS: YRS.slice(),
    HIST_N: HIST_N,
    D: _serializeD(),
    SV: Object.fromEntries(Object.entries(SV).map(([k,v])=>[k,v.slice()])),
  };
  let blob=new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  let ts=new Date().toISOString().slice(0,10);
  a.href=url; a.download='financial_model_'+ts+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function _excelNumberFormat(d){
  if(d&&d.pct)return '0.0%';
  let u=d&&d.u?d.u:'';
  if(u==='원'||u==='원/대'||u==='원/명'||u==='원/월'||u==='원/건')return '#,##0';
  if(['대','명','건','주'].includes(u))return '#,##0';
  if(u==='x')return '0.0x';
  if(['GWh','백만대','천$/대','백만$/GWh'].some(t=>u.includes(t)))return '#,##0.0';
  if(['$/','USD/','배럴','톤'].some(t=>u.includes(t)))return '#,##0.00';
  return 'General';
}

function _excelSheetRef(name){
  return "'"+String(name).replace(/'/g,"''")+"'";
}

function _excelDescendants(root){
  let out=[];
  function walk(k){
    if(!D[k]) return;
    out.push(k);
    Object.keys(D).forEach(child=>{
      if(D[child]&&D[child].parent===k) walk(child);
    });
  }
  walk(root);
  return out;
}

function _excelOrderedExisting(order, ids){
  let wanted=new Set(ids);
  return order.filter(k=>wanted.has(k));
}

function _excelIsKcarModel(){
  return ['ecommerce_sales','branch_sales','used_car_volume','fcff','value_per_share'].every(k=>D[k]);
}

function _excelKcarSheets(order){
  let sales=D.rev?_excelDescendants('rev'):[];
  let costAll=D.total_cost?_excelDescendants('total_cost'):[];
  let labor=D.labor_cost?_excelDescendants('labor_cost'):[];
  let excludedCost=new Set([...labor,'da']);
  let cost=costAll.filter(k=>!excludedCost.has(k));
  let capexDa=['capex','da'].filter(k=>D[k]);
  let nwc=['rev','nwc_rate','nwc','change_nwc'].filter(k=>D[k]);
  let dcf=[
    'rev','total_cost','op_profit','tax_rate','tax','ebiat','da','capex',
    'nwc','change_nwc','fcff','wacc','terminal_growth','discount_factor',
    'pv_fcff','terminal_value','pv_terminal_value','enterprise_value',
    'net_debt','equity_value','shares_outstanding','value_per_share'
  ].filter(k=>D[k]);
  let bs=['net_debt','shares_outstanding','equity_value','value_per_share'].filter(k=>D[k]);
  let bridge=[
    'rev','used_car_sales','ecommerce_sales','branch_sales','auction_sales',
    'rental_sales','service_other_sales','used_car_volume'
  ].filter(k=>D[k]);
  return {
    'DCF':_excelOrderedExisting(order,dcf),
    'Sales':_excelOrderedExisting(order,sales),
    'Sales Bridge':_excelOrderedExisting(order,bridge),
    'Cost':_excelOrderedExisting(order,cost),
    'CapEx,D&A':_excelOrderedExisting(order,capexDa),
    'Labor':_excelOrderedExisting(order,labor),
    'NWC':_excelOrderedExisting(order,nwc),
    'BS':_excelOrderedExisting(order,bs),
  };
}

function _excelSafeSheetName(name, fallback){
  let s=String(name||fallback||'Sheet').replace(/[\\/?*:[\]]/g,' ').trim()||fallback||'Sheet';
  if(s.length>31) s=s.slice(0,31).trim();
  return s || 'Sheet';
}

function _excelGenericSheets(order){
  let groups={};
  let roots=Object.keys(D).filter(k=>D[k]&&D[k].parent===null);
  let top=[];
  roots.forEach(root=>{
    Object.keys(D).forEach(k=>{ if(D[k]&&D[k].parent===root) top.push(k); });
  });
  if(!top.length) top=roots;
  top.forEach(k=>{
    let label=D[k]&&D[k].label?D[k].label:k;
    let sheet=_excelSafeSheetName(label,k);
    let base=sheet, n=2;
    while(groups[sheet]) sheet=_excelSafeSheetName(base.slice(0,27)+' '+n++,base);
    groups[sheet]=_excelOrderedExisting(order,_excelDescendants(k));
  });
  return groups;
}

function _excelModelSheets(order){
  return _excelIsKcarModel() ? _excelKcarSheets(order) : _excelGenericSheets(order);
}

function _excelTreeOrder(){
  let out=[], seen=new Set();
  function walk(k){
    if(!D[k]||seen.has(k)) return;
    seen.add(k); out.push(k);
    Object.keys(D).forEach(child=>{
      if(D[child]&&D[child].parent===k) walk(child);
    });
  }
  Object.keys(D).forEach(k=>{ if(!D[k].parent) walk(k); });
  Object.keys(D).forEach(walk);
  return out;
}

function _excelLevels(){
  let memo={};
  function lvl(k){
    if(memo[k]!=null) return memo[k];
    let p=D[k]&&D[k].parent;
    memo[k]=(!p||!D[p])?0:lvl(p)+1;
    return memo[k];
  }
  Object.keys(D).forEach(lvl);
  return memo;
}

function astToExcelSheet(ast, year, localRowMap, modelRowMap){
  function ref(name, yr){
    let col=_colLetter(EXCEL_DATA_START_COL+yr);
    if(localRowMap&&localRowMap[name]) return col+localRowMap[name];
    if(modelRowMap&&modelRowMap[name]) return _excelSheetRef('Model')+'!'+col+modelRowMap[name];
    throw new Error('미정의 변수: '+name);
  }
  function refRange(name){
    let start=_colLetter(EXCEL_DATA_START_COL);
    let end=_colLetter(EXCEL_DATA_START_COL+YRS.length-1);
    if(localRowMap&&localRowMap[name]) return start+localRowMap[name]+':'+end+localRowMap[name];
    if(modelRowMap&&modelRowMap[name]) return _excelSheetRef('Model')+'!'+start+modelRowMap[name]+':'+end+modelRowMap[name];
    throw new Error('미정의 변수: '+name);
  }
  function refEdge(name, edge){
    let col=edge==='last'?_colLetter(EXCEL_DATA_START_COL+YRS.length-1):_colLetter(EXCEL_DATA_START_COL);
    if(localRowMap&&localRowMap[name]) return col+localRowMap[name];
    if(modelRowMap&&modelRowMap[name]) return _excelSheetRef('Model')+'!'+col+modelRowMap[name];
    throw new Error('미정의 변수: '+name);
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return ref(ast.name, year);
    case 'neg': return '(-'+astToExcelSheet(ast.x, year, localRowMap, modelRowMap)+')';
    case 'bin': return '('+astToExcelSheet(ast.l, year, localRowMap, modelRowMap)+ast.op+astToExcelSheet(ast.r, year, localRowMap, modelRowMap)+')';
    case 'cmp': {
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+astToExcelSheet(ast.l, year, localRowMap, modelRowMap)+op+astToExcelSheet(ast.r, year, localRowMap, modelRowMap)+')';
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(['SUMALL','LAST','FIRST'].includes(fn)){
        if(ast.args.length!==1||ast.args[0].kind!=='ref') throw new Error(fn+'는 변수 참조 1개만 지원');
        let name=ast.args[0].name;
        if(fn==='SUMALL') return 'SUM('+refRange(name)+')';
        if(fn==='LAST') return refEdge(name,'last');
        if(fn==='FIRST') return refEdge(name,'first');
      }
      if(fn==='PREV'){
        if(year===0) return '0';
        let inner=ast.args[0];
        if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
        return ref(inner.name, year-1);
      }
      let args=ast.args.map(a=>astToExcelSheet(a, year, localRowMap, modelRowMap));
      if(fn==='AVG') return 'AVERAGE('+args.join(',')+')';
      return fn+'('+args.join(',')+')';
    }
  }
  throw new Error('AST 변환 실패');
}

function _excelMakeSheet(){
  return {};
}

function _excelSet(ws,r,c,cell){
  ws[XLSX.utils.encode_cell({r:r-1,c:c-1})]=cell;
}

function _excelCell(ws,r,c){
  return ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];
}

function _excelMergeStyle(base, extra){
  return Object.assign({}, base||{}, extra||{});
}

function _excelSetValue(ws,r,c,v,d,style){
  let cell={v:v==null?'':v,t:typeof v==='number'?'n':'s'};
  if(d) cell.z=_excelNumberFormat(d);
  if(style) cell.s=style;
  _excelSet(ws,r,c,cell);
}

function _excelSetFormula(ws,r,c,f,v,d,style){
  _excelSet(ws,r,c,{f:f,v:v==null?0:v,t:'n',z:_excelNumberFormat(d),s:style||EXCEL_STYLE.formula});
}

function _excelStyleCell(ws,r,c,style){
  let cell=_excelCell(ws,r,c);
  if(cell) cell.s=_excelMergeStyle(cell.s,style);
}

function _excelStyleRow(ws,r,c1,c2,style){
  for(let c=c1;c<=c2;c++){
    let cell=_excelCell(ws,r,c);
    if(!cell){ cell={v:'',t:'s'}; _excelSet(ws,r,c,cell); }
    cell.s=_excelMergeStyle(cell.s,style);
  }
}

function _excelApplyDefaultStyles(ws,rowCount,colCount,sheetName){
  ws['!views']=[{showGridLines:false,zoomScale:100}];
  ws['!rows']=Array.from({length:rowCount},(_,i)=>({hpt:i===0?16.5:15}));
  for(let r=1;r<=rowCount;r++){
    for(let c=1;c<=colCount;c++){
      let cell=_excelCell(ws,r,c);
      if(!cell) continue;
      if(r===1&&c===2){ cell.s=EXCEL_STYLE.title; continue; }
      if(r===3||r===4){ cell.s=_excelMergeStyle(EXCEL_STYLE.header,cell.s); continue; }
      if(c>=2&&c<=6){
        cell.s=_excelMergeStyle(cell.s,cell.v?EXCEL_STYLE.label:EXCEL_STYLE.meta);
      }else if(c===7){
        cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.id);
      }else if(c===8){
        cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.unit);
      }else if(c>=EXCEL_DATA_START_COL+1){
        if(sheetName==='Assumptions'&&!cell.f) cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.input);
        else if(cell.f&&String(cell.f).includes('!')) cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.link);
        else if(cell.f) cell.s=_excelMergeStyle(cell.s,EXCEL_STYLE.formula);
      }
    }
  }
}

function _excelWriteIndexSheet(wb,indexRows){

  indexRows.slice(2).forEach((row,i)=>{

    _excelSetValue(ws,r,2,row[0],null,EXCEL_STYLE.labelBold);
    _excelSetValue(ws,r,3,row[1],null,EXCEL_STYLE.label);
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:indexRows.length+1,c:2}});
  ws['!cols']=[{wch:1},{wch:24},{wch:74}];

function _excelFinalize(ws,rowCount,colCount,sheetName){
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rowCount-1,c:colCount-1}});
  ws['!cols']=[
    {wch:1},{wch:1},{wch:1},{wch:1},{wch:1},{wch:32},
    {wch:22},{wch:10},...YRS.map(()=>({wch:14}))
  ];
  _excelApplyDefaultStyles(ws,rowCount,colCount,sheetName||'');
}

function _excelPatchSheetViewXml(xml){
  let view='<sheetViews><sheetView workbookViewId="0" showGridLines="0" zoomScale="100">'
    +'<selection activeCell="A1" sqref="A1"/>'
    +'</sheetView></sheetViews>';
  if(/<sheetViews>[\s\S]*?<\/sheetViews>/.test(xml)) return xml.replace(/<sheetViews>[\s\S]*?<\/sheetViews>/,view);
  if(/<sheetFormatPr\b[^>]*\/>/.test(xml)) return xml.replace(/(<sheetFormatPr\b[^>]*\/>)/,'$1'+view);
  if(/<dimension\b[^>]*\/>/.test(xml)) return xml.replace(/(<dimension\b[^>]*\/>)/,'$1'+view);
  return xml.replace(/<worksheet([^>]*)>/,'<worksheet$1>'+view);
}

async function _excelDownloadWorkbook(wb, filename){
  if(typeof JSZip==='undefined'){
    XLSX.writeFile(wb,filename,{bookType:'xlsx',cellFormula:true,cellStyles:true});
    return;
  }
  let bytes=XLSX.write(wb,{bookType:'xlsx',type:'array',cellFormula:true,cellStyles:true});
  let zip=await JSZip.loadAsync(bytes);
  let sheetPaths=Object.keys(zip.files).filter(p=>/^xl\/worksheets\/sheet\d+\.xml$/.test(p));
  await Promise.all(sheetPaths.map(async p=>{
    let xml=await zip.file(p).async('string');
    zip.file(p,_excelPatchSheetViewXml(xml));
  }));
  let out=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let url=URL.createObjectURL(out);
  let a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function _excelWriteHeaders(ws,title){
  _excelSetValue(ws,1,2,title,null,EXCEL_STYLE.title);
  if(HIST_N>0){
    _excelSetValue(ws,3,EXCEL_DATA_START_COL+1,'Historical',null,EXCEL_STYLE.headerHistorical);
    for(let i=1;i<HIST_N;i++) _excelSetValue(ws,3,EXCEL_DATA_START_COL+1+i,'',null,EXCEL_STYLE.headerHistorical);
  }
  if(YRS.length>HIST_N){
    _excelSetValue(ws,3,EXCEL_DATA_START_COL+1+HIST_N,'Forecast',null,EXCEL_STYLE.headerForecast);
    for(let i=HIST_N+1;i<YRS.length;i++) _excelSetValue(ws,3,EXCEL_DATA_START_COL+1+i,'',null,EXCEL_STYLE.headerForecast);
  }
  ['ID','Unit'].forEach((h,i)=>_excelSetValue(ws,4,7+i,h,null,EXCEL_STYLE.header));
  YRS.forEach((y,i)=>_excelSetValue(ws,4,EXCEL_DATA_START_COL+1+i,y,null,_isFc(i)?EXCEL_STYLE.headerForecast:EXCEL_STYLE.header));
}

function _excelWriteNodeSheet(wb,name,nodeIds,levels,modelRowMap,inputRowMap,auditRows){
  let ws=_excelMakeSheet();
  _excelWriteHeaders(ws,name);
  let localRowMap={};
  nodeIds.forEach((k,i)=>{ localRowMap[k]=EXCEL_DATA_START_ROW+1+i; });
  let formulaCount=0;
  let linkCount=0;
  nodeIds.forEach(k=>{
    let d=D[k]; if(!d) return;
    let row=localRowMap[k];
    let labelCol=Math.min(2+(levels[k]||0),6);
    let isSection=d.type==='computed'&&((levels[k]||0)<=1||['root','rev','total_cost','fcff','valuation'].includes(k));
    _excelSetValue(ws,row,labelCol,d.label||k,null,isSection?EXCEL_STYLE.labelBold:EXCEL_STYLE.label);
    _excelSetValue(ws,row,7,k,null,EXCEL_STYLE.id);
    _excelSetValue(ws,row,8,d.u||'',null,EXCEL_STYLE.unit);
    if(d.type==='input'){
      let arow=inputRowMap[k];
      for(let i=0;i<YRS.length;i++){
        let f=_excelSheetRef('Assumptions')+'!'+_colLetter(EXCEL_DATA_START_COL+i)+arow;
        _excelSetFormula(ws,row,EXCEL_DATA_START_COL+1+i,f,(d.v&&d.v[i]!=null)?d.v[i]:0,d,EXCEL_STYLE.link);
        auditRows.push([name,k,d.label||k,YRS[i],_colLetter(EXCEL_DATA_START_COL+i)+row,'='+f,'assumption link']);
        linkCount++;
      }
    }else if(d.type==='computed'){
      let ast=parseFormula(d.formula||'');
      for(let i=0;i<YRS.length;i++){
        let f=astToExcelSheet(ast,i,localRowMap,modelRowMap);
        _excelSetFormula(ws,row,EXCEL_DATA_START_COL+1+i,f,(d.v&&d.v[i]!=null)?d.v[i]:0,d,isSection?EXCEL_STYLE.output:EXCEL_STYLE.formula);
        auditRows.push([name,k,d.label||k,YRS[i],_colLetter(EXCEL_DATA_START_COL+i)+row,'='+f,'sheet calculation']);
        formulaCount++;
      }
    }
    if(isSection) _excelStyleRow(ws,row,2,EXCEL_DATA_START_COL+YRS.length,EXCEL_STYLE.section);
  });
  _excelFinalize(ws,EXCEL_DATA_START_ROW+nodeIds.length,YRS.length+EXCEL_DATA_START_COL,name);
  XLSX.utils.book_append_sheet(wb,ws,name);
  return {formulaCount,linkCount};
}



function astToExcelR1C1(ast, year, rowMap, currentRow, currentCol){
  function rc(row, col){
    let dr=row-currentRow;
    let dc=col-currentCol;
    let r=dr===0?'R':'R['+dr+']';
    let c=dc===0?'C':'C['+dc+']';
    return r+c;
  }
  function ref(name, yr){
    let row=rowMap[name];
    if(!row) throw new Error('미정의 변수: '+name);
    return rc(row,4+yr);
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return ref(ast.name, year);
    case 'neg': return '(-'+astToExcelR1C1(ast.x, year, rowMap, currentRow, currentCol)+')';
    case 'bin': {
      let l=astToExcelR1C1(ast.l, year, rowMap, currentRow, currentCol);
      let r=astToExcelR1C1(ast.r, year, rowMap, currentRow, currentCol);
      return '('+l+ast.op+r+')';
    }
    case 'cmp': {
      let l=astToExcelR1C1(ast.l, year, rowMap, currentRow, currentCol);
      let r=astToExcelR1C1(ast.r, year, rowMap, currentRow, currentCol);
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+l+op+r+')';
    }
    case 'fn': {
      let fn=ast.name.toUpperCase();
      if(['SUMALL','LAST','FIRST'].includes(fn)){
        if(ast.args.length!==1||ast.args[0].kind!=='ref') throw new Error(fn+'는 변수 참조 1개만 지원');
        let row=rowMap[ast.args[0].name];
        if(!row) throw new Error('미정의 변수: '+ast.args[0].name);
        if(fn==='SUMALL') return 'SUM('+rc(row,4)+':'+rc(row,4+YRS.length-1)+')';
        if(fn==='LAST') return rc(row,4+YRS.length-1);
        if(fn==='FIRST') return rc(row,4);
      }
      let args=ast.args.map(a=>astToExcelR1C1(a, year, rowMap, currentRow, currentCol));
      switch(fn){
        case 'SUM': return 'SUM('+args.join(',')+')';
        case 'MIN': return 'MIN('+args.join(',')+')';
        case 'MAX': return 'MAX('+args.join(',')+')';
        case 'AVG': return 'AVERAGE('+args.join(',')+')';
        case 'IF': return 'IF('+args[0]+','+args[1]+','+args[2]+')';
        case 'PREV': {
          if(year===0) return '0';
          let inner=ast.args[0];
          if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
          return ref(inner.name, year-1);
        }
        default: throw new Error('미지 함수: '+fn);
      }
    }
  }
  throw new Error('AST 변환 실패');
}

function _xmlEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _excelXmlFormula(f){return '='+f.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function _downloadFormulaXmlWorkbook(order,rowMap,formulaRows,base,ts){
  let ss='urn:schemas-microsoft-com:office:spreadsheet';
  let rows=[];
  rows.push('<Row>'+['Variable','Label','Unit',...YRS].map(h=>'<Cell><Data ss:Type="String">'+_xmlEsc(h)+'</Data></Cell>').join('')+'</Row>');
  for(let k of order){
    let d=D[k]; if(!d) continue;
    let cells=[k,d.label||k,d.u||''].map(v=>'<Cell><Data ss:Type="String">'+_xmlEsc(v)+'</Data></Cell>');
    if(d.type==='input'){
      for(let i=0;i<YRS.length;i++) cells.push('<Cell><Data ss:Type="Number">'+((d.v&&d.v[i]!=null)?d.v[i]:0)+'</Data></Cell>');
    }else{
      let ast=parseFormula(d.formula||'');
      for(let i=0;i<YRS.length;i++){
        let f=astToExcelR1C1(ast,i,rowMap,rowMap[k],4+i);
        let v=(d.v&&d.v[i]!=null)?d.v[i]:0;
        cells.push('<Cell ss:Formula="'+_excelXmlFormula(f)+'"><Data ss:Type="Number">'+v+'</Data></Cell>');
      }
    }
    rows.push('<Row>'+cells.join('')+'</Row>');
  }
  let auditRows=[];
  auditRows.push('<Row>'+['ID','Label','Year','Cell','Formula'].map(h=>'<Cell><Data ss:Type="String">'+_xmlEsc(h)+'</Data></Cell>').join('')+'</Row>');
  formulaRows.forEach(r=>{
    auditRows.push('<Row>'+r.map(v=>'<Cell><Data ss:Type="String">'+_xmlEsc(v)+'</Data></Cell>').join('')+'</Row>');
  });
  let indexRows=['Financial Model Index','Index / Control / Model / Formula Audit / Checks / Metadata'].map(v=>'<Row><Cell><Data ss:Type="String">'+_xmlEsc(v)+'</Data></Cell></Row>').join('');
  let checksRows='<Row><Cell><Data ss:Type="String">Check</Data></Cell><Cell><Data ss:Type="String">Result</Data></Cell></Row>'
    +'<Row><Cell><Data ss:Type="String">Formula cells generated</Data></Cell><Cell><Data ss:Type="Number">'+formulaRows.length+'</Data></Cell></Row>'
    +'<Row><Cell><Data ss:Type="String">Formula cells > 0</Data></Cell><Cell><Data ss:Type="String">'+(formulaRows.length>0?'OK':'FAIL')+'</Data></Cell></Row>';
  let controlRows='<Row><Cell><Data ss:Type="String">Control / Key Outputs</Data></Cell></Row>';
  let metaRows='<Row><Cell><Data ss:Type="String">Generated by</Data></Cell><Cell><Data ss:Type="String">HTML exportToExcel fallback</Data></Cell></Row>';
  let xml='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>'
    +'<Workbook xmlns="'+ss+'" xmlns:ss="'+ss+'">'
    +'<Worksheet ss:Name="Index"><Table>'+indexRows+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Control"><Table>'+controlRows+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Model"><Table>'+rows.join('')+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Formula Audit"><Table>'+auditRows.join('')+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Checks"><Table>'+checksRows+'</Table></Worksheet>'
    +'<Worksheet ss:Name="Metadata"><Table>'+metaRows+'</Table></Worksheet>'
    +'</Workbook>';
  let blob=new Blob([xml],{type:'application/vnd.ms-excel'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  a.href=url; a.download=base+'_'+ts+'.xls';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

async function exportToExcel(){
  simCalc();

  let calcOrder;
  try{ calcOrder=topoSort(); }
  catch(e){ alert('순환 참조 때문에 Excel을 생성할 수 없습니다: '+e.message); return; }

  let order=_excelTreeOrder();
  let levels=_excelLevels();
  let modelRowMap={};
  order.forEach((k,i)=>{ modelRowMap[k]=EXCEL_DATA_START_ROW+1+i; });
  let inputOrder=order.filter(k=>D[k]&&D[k].type==='input');
  let inputRowMap={};
  inputOrder.forEach((k,i)=>{ inputRowMap[k]=EXCEL_DATA_START_ROW+1+i; });

  let ts=new Date().toISOString().slice(0,10);

    let formulaRows=[];
    let errors=[];
    for(let k of calcOrder){
      let d=D[k]; if(!d||d.type!=='computed') continue;
      if(!d.formula){ errors.push(k+': 계산 노드에 formula 없음'); continue; }
      let ast;

      for(let i=0;i<YRS.length;i++){

        catch(e){ errors.push(k+' '+YRS[i]+': Excel 수식 변환 실패 — '+e.message); }
      }

    if(errors.length){
      alert('Excel 수식 생성 실패:\n'+errors.slice(0,12).join('\n')+(errors.length>12?'\n...':'')+'\n\n값만 들어간 파일은 생성하지 않습니다.');

    'CapEx,D&A':'투자와 감가상각비',

    ['Formula cells generated',formulaCells],

  let wsChecks=XLSX.utils.aoa_to_sheet(checkRows);

  let metaRows=[

    ['Nodes',order.length],

  let wsMeta=XLSX.utils.aoa_to_sheet(metaRows);

  await _excelDownloadWorkbook(wb,base+'_'+ts+'.xlsx');
}

// ============================================================
// SIM_SECS — 시뮬레이터 슬라이더 정의 (D에서 자동 생성)
//
// 입력 노드(type='input')를 부모(parent)별로 그룹핑하여 섹션 구성.
// min/max/step은 현재값과 단위에서 자동 추정 (필요시 D[k].sliderMin/Max/Step 명시).
// ============================================================
function buildSimSecs(){
  let byParent={};
  for(let k of INPUT_KEYS){
    let d=D[k]; if(!d) continue;
    let p=d.parent||'_orphan';
    (byParent[p]=byParent[p]||[]).push(k);
  }
  let secs=[];
  // root → leaves 순서로 부모 정렬
  let order=[];
  function walk(id){
    let kids=Object.keys(D).filter(k=>D[k].parent===id);
    if(byParent[id]) order.push(id);
    kids.forEach(walk);
  }
  walk('root');
  if(byParent['_orphan']) order.push('_orphan');

  for(let pid of order){
    let p=D[pid]||{};
    let inputs=byParent[pid];
    secs.push({
      t:(p.label||pid)+' 드라이버',
      c:p.bg||p.c||'#5D68F7',
      v:inputs.map(k=>{
        let d=D[k];
        // 사용자 명시값 우선, 없으면 자동 추정
        let cur=d.v && d.v.length ? Math.max(...d.v.map(Math.abs)) : 1;
        let min, max, step, pct;
        if(d.sliderMin!==undefined){
          min=d.sliderMin; max=d.sliderMax; step=d.sliderStep;
        } else if(d.pct){
          min=0; max=1; step=0.001; pct=1;
        } else if(d.u==='%'){
          min=0; max=1; step=0.001; pct=1;
        } else {
          // 현재값의 0~2배 범위, step은 그 1%
          min=0; max=Math.max(cur*2, 1);
          step=Math.max(max/100, 1);
          // 정수 단위 추정 (대/명/건 등은 step=1 이상)
          if(['대','명','건'].includes(d.u)) step=Math.max(Math.round(step), 1);
        }
        return {k, l:d.label, u:d.u, min, max, step, p:pct};
      })
    });
  }
  return secs;
}
SIM_SECS=buildSimSecs();

// ============ SCENARIO (CASE) MANAGEMENT ============
let _cases={}; // {name: {sv: deep copy of SV}}
let _activeCase=null; // null = base (기본값 or manual)

function _saveCaseState(){
  let snap={};for(let k in SV)snap[k]=SV[k].slice();return snap;
}
function _loadCaseState(snap){
  for(let k in snap)SV[k]=snap[k].slice();
  simCalc();renderAll();refreshOpenChart();_buildSliders();
  _renderCaseBar();
}
function _addCase(){
  let names=Object.keys(_cases);
  let next=String.fromCharCode(65+names.length); // A, B, C, ...
  if(names.length>=10)return;
  _cases[next]=_saveCaseState();
  _activeCase=next;
  _renderCaseBar();
}
function _switchCase(name){
  if(name===null){
    // Back to base (reset)
    _activeCase=null;
    for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();
    simCalc();renderAll();refreshOpenChart();_buildSliders();
    _renderCaseBar();return;
  }
  // Save current to active case before switching
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
  _activeCase=name;
  if(_cases[name])_loadCaseState(_cases[name]);
  _renderCaseBar();
}
function _updateActiveCase(){
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
}
function _deleteCase(name){
  delete _cases[name];
  if(_activeCase===name){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders()}
  _renderCaseBar();
}
function _renderCaseBar(){
  let bar=document.getElementById('_caseBar');if(!bar)return;
  bar.innerHTML='';
  // Base button
  let base=document.createElement('div');
  base.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;border:1px solid '+(_activeCase===null?'#333':'#ddd')+';background:'+(_activeCase===null?'#333':'#fff')+';color:'+(_activeCase===null?'#fff':'#888');
  base.textContent='기본값';
  base.onclick=function(){_switchCase(null)};
  bar.appendChild(base);
  // Case buttons
  Object.keys(_cases).sort().forEach(function(name){
    let btn=document.createElement('div');
    btn.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;position:relative;border:1px solid '+(_activeCase===name?'#5D68F7':'#ddd')+';background:'+(_activeCase===name?'#5D68F7':'#fff')+';color:'+(_activeCase===name?'#fff':'#888');
    btn.textContent='Case '+name;
    btn.onclick=function(){_switchCase(name)};
    // Delete X
    let del=document.createElement('span');
    del.style.cssText='margin-left:6px;color:'+(_activeCase===name?'rgba(255,255,255,0.6)':'#ccc')+';font-size:9px;cursor:pointer';
    del.textContent='✕';
    del.onclick=function(e){e.stopPropagation();_deleteCase(name)};
    btn.appendChild(del);
    bar.appendChild(btn);
  });
  // Add button
  if(Object.keys(_cases).length<10){
    let add=document.createElement('div');
    add.style.cssText='padding:3px 8px;font-size:10px;border-radius:3px;cursor:pointer;border:1px dashed #ccc;color:#aaa';
    add.textContent='+ 케이스';
    add.onclick=_addCase;
    bar.appendChild(add);
  }
  // Count changes vs defaults
  let nChanged=0;for(let k in DEFAULTS_S)for(let i=0;i<YRS.length;i++)if(Math.abs(SV[k][i]-DEFAULTS_S[k][i])>1e-8)nChanged++;
  if(nChanged>0){
    let info=document.createElement('span');
    info.style.cssText='font-size:9px;color:#aaa;margin-left:4px';
    info.textContent=nChanged+'개 변경';
    bar.appendChild(info);
  }
}

      // Bulk ±% slider
      let bulkRow=document.createElement('div');bulkRow.style.cssText='display:flex;align-items:center;gap:6px;margin-top:4px';
      let bulkLabel=document.createElement('span');bulkLabel.style.cssText='font-size:9px;color:#aaa;white-space:nowrap';bulkLabel.textContent='±%';
      let bulkVal=document.createElement('span');bulkVal.style.cssText='font-size:9px;font-family:Arial,sans-serif;color:#555;min-width:36px;text-align:center';bulkVal.textContent='±0%';
      let bulkRng=document.createElement('input');bulkRng.type='range';bulkRng.min='-50';bulkRng.max='100';bulkRng.step='1';bulkRng.value='0';
      bulkRng.style.cssText='flex:1;margin:0;-webkit-appearance:none;appearance:none;height:3px;background:linear-gradient(to right,#DC2626 0%,#E5E7EB 50%,#22C55E 100%);border-radius:2px;outline:none';
      let bulkReset=document.createElement('span');bulkReset.style.cssText='font-size:9px;color:#aaa;cursor:pointer';bulkReset.textContent='↺';
      bulkRow.appendChild(bulkLabel);bulkRow.appendChild(bulkRng);bulkRow.appendChild(bulkVal);bulkRow.appendChild(bulkReset);
      row.appendChild(bulkRow);

      let bulkBase=null;
      bulkRng.addEventListener('mousedown',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('touchstart',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('input',function(){
        let pct=+this.value;
        bulkVal.textContent=(pct>=0?'+':'')+pct+'%';
        bulkVal.style.color=pct>0?'#22C55E':pct<0?'#DC2626':'#555';
        if(!bulkBase)bulkBase=DEFAULTS_S[vr.k].slice();
        activeYrs.forEach(j=>{
          let base=bulkBase[j];
          SV[vr.k][j]=vr.p?Math.max(0,Math.min(vr.max,base*(1+pct/100))):Math.max(vr.min,Math.min(vr.max,Math.round(base*(1+pct/100))));
        });
        rng.value=SV[vr.k][dispYr];
        vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });
      bulkReset.onclick=function(){
        bulkRng.value=0;bulkVal.textContent='±0%';bulkVal.style.color='#555';
        activeYrs.forEach(j=>{SV[vr.k][j]=DEFAULTS_S[vr.k][j]});
        rng.value=SV[vr.k][dispYr];vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_buildSliders();
      };

      // Reset all years for this var
      let rst=lbl.querySelector('._rst');
      if(rst)rst.onclick=function(e){e.stopPropagation();let k=this.dataset.k;for(let j=0;j<YRS.length;j++)SV[k][j]=DEFAULTS_S[k][j];simCalc();renderAll();refreshOpenChart();_buildSliders()};

      secBody.appendChild(row);
    });
  });
}

function _resetSim(){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders();_renderCaseBar()}

</script>
</body>
</html>
