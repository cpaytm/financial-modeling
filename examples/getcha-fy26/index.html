// ============ ENGINE (same as v4/v5) ============
const NW=170,NH=48,DH=40,GX=22,GY=22,PAD=40,ICON_W=20;
const dpr=window.devicePixelRatio||1;
let cvs,ctx,W,H,cam={x:0,y:0,s:1};
let openSet=new Set(['root','rev']);
let positions={},allNodes=[],hoverId=null,hoverChart=null;

function nodeH(n){return n.drv?DH:NH}
function nodeW(n){return NW}
function treeH_sub(n){if(!n.children||!n.children.length||!openSet.has(n.id))return nodeH(n);let ch=0;n.children.forEach((c,i)=>{if(i)ch+=GY;ch+=treeH_sub(c)});return Math.max(nodeH(n),ch)}
function treeW_sub(n){if(!n.children||!n.children.length||!openSet.has(n.id))return NW;let maxCW=0;n.children.forEach(c=>{let cw=treeW_sub(c);if(cw>maxCW)maxCW=cw});return NW+GX+maxCW}
function doLayout(n,x,y,par){let h=nodeH(n),th=treeH_sub(n);let ny=y+(th-h)/2;positions[n.id]={x,y:ny,w:NW,h,tw:NW};allNodes.push(n);if(par)parentMap[n.id]=par.id;if(!n.children||!n.children.length||!openSet.has(n.id))return;let cx=x+NW+GX,cy=y;n.children.forEach((c,i)=>{if(i)cy+=GY;doLayout(c,cx,cy,n);cy+=treeH_sub(c)})}

function rrect(x,y,w,h,r,fill,stroke,sw,dash){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.save();ctx.strokeStyle=stroke;ctx.lineWidth=sw||0.7;if(dash)ctx.setLineDash(dash);else ctx.setLineDash([]);ctx.stroke();ctx.restore()}}
function txt(t,x,y,sz,wt,col,al){ctx.save();ctx.font=`${wt} ${sz}px 'Noto Sans KR',Arial,sans-serif`;ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillText(t,x,y);ctx.restore()}
function ln(x1,y1,x2,y2,d){ctx.save();ctx.strokeStyle='#bbb';ctx.lineWidth=0.7;if(d)ctx.setLineDash([3,2]);else ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}


function getPos(id){
  let p=positions[id];if(!p)return null;
  // Accumulate offsets up the ancestor chain
  let dx=0,dy=0,cur=id;
  while(cur){
    let o=nodeOffsets[cur];
    if(o){dx+=o.dx;dy+=o.dy}
    cur=parentMap[cur];
  }
  return{x:p.x+dx,y:p.y+dy,w:p.w,h:p.h,tw:p.tw};
}
function drawConns(n,par){if(par){let pp=getPos(par.id),cp=getPos(n.id);if(pp&&cp){let px=pp.x+pp.w,py=pp.y+pp.h/2,cx=cp.x,cy=cp.y+cp.h/2;ctx.save();ctx.strokeStyle=n.drv?'#ccc':'#aaa';ctx.lineWidth=n.drv?0.6:0.8;if(n.drv)ctx.setLineDash([3,2]);else ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(px,py);let mx=(px+cx)/2;ctx.bezierCurveTo(mx,py,mx,cy,cx,cy);ctx.stroke();ctx.restore()}}if(n.children&&n.children.length&&openSet.has(n.id))n.children.forEach(c=>drawConns(c,n))}

function drawNode(n){let p=getPos(n.id);if(!p)return;let{x,y,w,h}=p;let isH=hoverId===n.id;let hasData=n.data&&D[n.data];
  if(n.drv){rrect(x,y,w,h,4,'#fafaf8','#bbb',0.5,[3,2]);if(isH)rrect(x,y,w,h,4,'rgba(0,0,0,0.03)');
  let _isInp=n.data&&INPUT_KEYS.has(n.data);
  if(_isInp){
    ctx.save();ctx.fillStyle='#EF9F27';ctx.beginPath();ctx.arc(x+5,y+13,2.5,0,Math.PI*2);ctx.fill();ctx.restore();
    txt(n.label,x+12,y+13,9,'400','#555');
    txt('가정변수: 하드코딩',x+12,y+28,7,'400','#C78520');
  }else{txt(n.label,x+8,y+h/2,9,'400','#666')}
  if(hasData){let ic=hoverChart===n.id?'#555':'#bbb';ctx.save();ctx.fillStyle=ic;ctx.fillRect(x+w-18,y+8,3,7);ctx.fillRect(x+w-13,y+5,3,10);ctx.fillRect(x+w-8,y+3,3,12);ctx.restore()}}
  else{let bg=n.bg||'#fff',bdr=n.bdr||'#ccc',fg=n.fg||'#333',sfg=n.sfg||'#999',dk=fg==='#fff';rrect(x,y,w,h,dk?8:6,bg,bdr,dk?0:0.7);if(isH)rrect(x,y,w,h,dk?8:6,dk?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.04)');let ly=n.sub?y+h*.36:y+h/2;txt(n.label,x+w/2,ly,11,'600',fg,'center');if(n.sub)txt(n.sub,x+w/2,y+h*.68,8.5,'400',sfg,'center');let hk=n.children&&n.children.length;if(hk){let ar=openSet.has(n.id)?'◀':'▶';txt(ar,x+w-13,y+h/2,7.5,'400',dk?'rgba(255,255,255,0.3)':'#ccc')}if(hasData){if(dk){let ic=hoverChart===n.id?'rgba(255,255,255,0.6)':'rgba(255,255,255,0.25)';ctx.save();ctx.fillStyle=ic;ctx.fillRect(x+w-18,y+10,3,7);ctx.fillRect(x+w-13,y+7,3,10);ctx.fillRect(x+w-8,y+5,3,12);ctx.restore()}else{let ic=hoverChart===n.id?'#555':'#bbb';ctx.save();ctx.fillStyle=ic;ctx.fillRect(x+w-18,y+10,3,7);ctx.fillRect(x+w-13,y+7,3,10);ctx.fillRect(x+w-8,y+5,3,12);ctx.restore()}}}
  if(n.children&&n.children.length&&openSet.has(n.id))n.children.forEach(drawNode)}

let parentMap={};
function renderAll(){allNodes=[];positions={};parentMap={};doLayout(TREE,PAD,PAD,null);ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.translate(cam.x,cam.y);ctx.scale(cam.s,cam.s);drawConns(TREE,null);drawNode(TREE);ctx.restore()}

// ============ CHART POPUP ============
function fmtNum(v,u,pct){if(pct)return(v*100).toFixed(1)+'%';if(u==='원'||u==='원/건'||u==='원/대'||u==='원/월'){if(Math.abs(v)>=1e8)return(v/1e8).toFixed(1)+'억';if(Math.abs(v)>=1e4)return(v/1e4).toFixed(0)+'만';return v.toLocaleString('ko-KR')}return v.toLocaleString('ko-KR')}
function fmtFull(v,u,pct){if(pct)return(v*100).toFixed(1)+'%';return v.toLocaleString('ko-KR')}
let _currentChartNode=null;
function showChart(node){
  _currentChartNode=node;
  let datasets=[];
  if(node.data&&D[node.data])datasets.push({label:node.label,key:node.data});
  if(node.extra)node.extra.forEach(e=>datasets.push({label:e.label,key:e.data}));
  if(!datasets.length)return;
  document.getElementById('popupTitle').textContent=node.label;
  document.getElementById('popupSub').textContent=node.sub||'';
  let body=document.getElementById('popupBody');body.innerHTML='';

  datasets.forEach(ds=>{
    let d=D[ds.key];if(!d)return;
    let vals=d.v,u=d.u,pct=d.pct,color=d.c||'#888';
    let maxV=Math.max(...vals.map(Math.abs),1);
    let sec=document.createElement('div');sec.className='ds-section';
    if(datasets.length>1||d.desc){let h=document.createElement('div');h.className='ds-label';h.textContent=ds.label;sec.appendChild(h)}
    if(d.desc){let desc=document.createElement('div');desc.className='ds-desc';desc.textContent=d.desc;sec.appendChild(desc)}
    let bars=document.createElement('div');bars.className='chart-bars';
    vals.forEach((v,i)=>{
      let wr=document.createElement('div');wr.className='chart-bar-wrap';
      let vl=document.createElement('div');vl.className='chart-val';vl.textContent=fmtNum(v,u,pct);
      let br=document.createElement('div');br.className='chart-bar';
      let ht=pct?Math.max((v/Math.max(...vals.map(Math.abs)))*130,2):Math.max((Math.abs(v)/maxV)*130,2);
      br.style.height=ht+'px';br.style.background=color;
      let yr=document.createElement('div');yr.className='chart-yr';yr.textContent=YRS[i].slice(2)+'년';

      // Make clickable for rev node (insert bridge below)
      if(ds.key==='rev'){
        wr.style.cursor='pointer';
        wr.title=YRS[i]+'→'+YRS[i+1]+' 브릿지 보기';
        wr.onclick=function(){toggleBridgeInline(body,sec,i,wr)};
      }
      wr.appendChild(vl);wr.appendChild(br);wr.appendChild(yr);bars.appendChild(wr)});
    sec.appendChild(bars);

    let tbl=document.createElement('table');tbl.className='chart-table';
    let th=document.createElement('tr');th.innerHTML='<th></th>'+YRS.map(y=>'<th>'+y+'</th>').join('');tbl.appendChild(th);
    let tr=document.createElement('tr');tr.innerHTML='<td style="text-align:left;color:#888;font-size:9px">'+ds.label+'</td>'+vals.map(v=>'<td>'+fmtFull(v,u,pct)+'</td>').join('');tbl.appendChild(tr);
    sec.appendChild(tbl);
    let ut=document.createElement('div');ut.className='chart-unit';ut.textContent='단위: '+u;sec.appendChild(ut);

    if(ds.key==='rev'){
      let hint=document.createElement('div');
      hint.style.cssText='font-size:10px;color:#aaa;margin-top:8px;text-align:center';

let bridgeSelection = []; // stores [yearIdx1, yearIdx2] or [yearIdx1]
let bridgeParentSec = null;
let bridgeBody = null;
let bridgeBarEls = [];

function toggleBridgeInline(body,parentSec,yearIdx,barEl){
  bridgeBody = body;
  bridgeParentSec = parentSec;

  let idx = bridgeSelection.indexOf(yearIdx);
  if(idx !== -1){
    // Deselect
    bridgeSelection.splice(idx, 1);
  } else {
    if(bridgeSelection.length === 0){
      bridgeSelection.push(yearIdx);
    } else if(bridgeSelection.length === 1){
      bridgeSelection.push(yearIdx);
      bridgeSelection.sort((a,b)=>a-b);
    } else {
      // Already 2 selected, replace: keep the other one closest, or just reset
      bridgeSelection = [yearIdx];
    }
  }

  // Update bar highlights
  parentSec.querySelectorAll('.chart-bar-wrap').forEach((w,i)=>{
    if(bridgeSelection.includes(i)){
      w.style.outline='2px solid #333';
      w.style.outlineOffset='2px';
      w.style.borderRadius='4px';
    } else {
      w.style.outline='none';
    }
  });

  // Remove existing bridge
  let existing = document.getElementById('inlineBridge');
  if(existing) existing.remove();

  if(bridgeSelection.length === 0) return;

  let fi, ti;
  if(bridgeSelection.length === 1){
    fi = bridgeSelection[0];
    ti = fi + 1;
    if(ti > 6) { ti = 6; fi = 5; }
  } else {
    fi = bridgeSelection[0];
    ti = bridgeSelection[1];
  }

  renderBridge(fi, ti, parentSec);
}

function s2w(sx,sy){return{x:(sx-cam.x)/cam.s,y:(sy-cam.y)/cam.s}}
function hitTest(sx,sy){let w=s2w(sx,sy);for(let i=allNodes.length-1;i>=0;i--){let n=allNodes[i],p=getPos(n.id);if(!p)continue;if(w.x>=p.x&&w.x<=p.x+p.w&&w.y>=p.y&&w.y<=p.y+p.h){let inChart=n.data&&D[n.data]&&w.x>=p.x+p.w-ICON_W&&w.y<=p.y+24;return{node:n,isChart:inChart}}}return null}

// ============ SCENARIO (CASE) MANAGEMENT ============
let _cases={}; // {name: {sv: deep copy of SV}}
let _activeCase=null; // null = base (기본값 or manual)

function _saveCaseState(){
  let snap={};for(let k in SV)snap[k]=SV[k].slice();return snap;
}
function _loadCaseState(snap){
  for(let k in snap)SV[k]=snap[k].slice();
  simCalc();renderAll();refreshOpenChart();_buildSliders();
  _renderCaseBar();
}
function _addCase(){
  let names=Object.keys(_cases);
  let next=String.fromCharCode(65+names.length); // A, B, C, ...
  if(names.length>=10)return;
  _cases[next]=_saveCaseState();
  _activeCase=next;
  _renderCaseBar();
}
function _switchCase(name){
  if(name===null){
    // Back to base (reset)
    _activeCase=null;
    for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();
    simCalc();renderAll();refreshOpenChart();_buildSliders();
    _renderCaseBar();return;
  }
  // Save current to active case before switching
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
  _activeCase=name;
  if(_cases[name])_loadCaseState(_cases[name]);
  _renderCaseBar();
}
function _updateActiveCase(){
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
}
function _deleteCase(name){
  delete _cases[name];
  if(_activeCase===name){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders()}
  _renderCaseBar();
}
function _renderCaseBar(){
  let bar=document.getElementById('_caseBar');if(!bar)return;
  bar.innerHTML='';
  // Base button
  let base=document.createElement('div');
  base.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;border:1px solid '+(_activeCase===null?'#333':'#ddd')+';background:'+(_activeCase===null?'#333':'#fff')+';color:'+(_activeCase===null?'#fff':'#888');
  base.textContent='기본값';
  base.onclick=function(){_switchCase(null)};
  bar.appendChild(base);
  // Case buttons
  Object.keys(_cases).sort().forEach(function(name){
    let btn=document.createElement('div');
    btn.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;position:relative;border:1px solid '+(_activeCase===name?'#EF9F27':'#ddd')+';background:'+(_activeCase===name?'#EF9F27':'#fff')+';color:'+(_activeCase===name?'#fff':'#888');
    btn.textContent='Case '+name;
    btn.onclick=function(){_switchCase(name)};
    // Delete X
    let del=document.createElement('span');
    del.style.cssText='margin-left:6px;color:'+(_activeCase===name?'rgba(255,255,255,0.6)':'#ccc')+';font-size:9px;cursor:pointer';
    del.textContent='✕';
    del.onclick=function(e){e.stopPropagation();_deleteCase(name)};
    btn.appendChild(del);
    bar.appendChild(btn);
  });
  // Add button
  if(Object.keys(_cases).length<10){
    let add=document.createElement('div');
    add.style.cssText='padding:3px 8px;font-size:10px;border-radius:3px;cursor:pointer;border:1px dashed #ccc;color:#aaa';
    add.textContent='+ 케이스';
    add.onclick=_addCase;
    bar.appendChild(add);
  }
  // Count changes vs defaults
  let nChanged=0;for(let k in DEFAULTS_S)for(let i=0;i<7;i++)if(Math.abs(SV[k][i]-DEFAULTS_S[k][i])>1e-8)nChanged++;
  if(nChanged>0){
    let info=document.createElement('span');
    info.style.cssText='font-size:9px;color:#aaa;margin-left:4px';
    info.textContent=nChanged+'개 변경';
    bar.appendChild(info);
  }
}

let _selectedYrs=new Set();
let _collapsedSecs=new Set(); // empty = all 2026-2031

function _getAffectedYears(){
  if(_selectedYrs.size===0) return [1,2,3,4,5,6]; // all except 2025
  return [..._selectedYrs].filter(i=>i>0).sort();
}

function _buildSliders(){
  let bd=document.getElementById('_simBody');if(!bd)return;bd.innerHTML='';
  let activeYrs=_simYrs.size>0?[..._simYrs].sort():[1,2,3,4,5,6]; // default: 26~31

  // Year selector (multi-toggle)
  let yrWrap=document.createElement('div');yrWrap.style.cssText='margin-bottom:4px';
  let yrHint=document.createElement('div');yrHint.style.cssText='font-size:9px;color:#aaa;margin-bottom:4px';
  yrHint.textContent=_simYrs.size===0?'전체 연도 조정 (클릭하여 특정 연도 선택)':'선택된 연도만 조정';
  yrWrap.appendChild(yrHint);
  let yr=document.createElement('div');yr.style.cssText='display:flex;gap:2px';
  YRS.forEach((y,i)=>{
    let sel=_simYrs.has(i);
    let isLocked=i===0;
    let b=document.createElement('div');
    let bg=isLocked?'#f0f0f0':sel?'#333':(_simYrs.size===0&&i>0)?'#555':'#fff';
    let fg=isLocked?'#bbb':sel?'#fff':(_simYrs.size===0&&i>0)?'#fff':'#888';
    let bdr=isLocked?'#ddd':sel?'#333':(_simYrs.size===0&&i>0)?'#555':'#e0e0e0';
    b.style.cssText='flex:1;padding:3px 0;font-size:9px;text-align:center;border:1px solid '+bdr+';border-radius:3px;cursor:'+(isLocked?'default':'pointer')+';font-family:Arial,sans-serif;color:'+fg+';background:'+bg;
    b.textContent=isLocked?y+' 실적':y;
    if(!isLocked){
      b.onclick=()=>{
        if(_simYrs.has(i))_simYrs.delete(i);
        else _simYrs.add(i);
        // If all 26~31 selected, clear to mean "all"
        if(_simYrs.size===6&&!_simYrs.has(0)){_simYrs.clear()}
        _buildSliders();
      };
    }
    yr.appendChild(b);
  });
  yrWrap.appendChild(yr);
  bd.appendChild(yrWrap);

  // Display representative year for slider value (first selected, or 2026)
  let dispYr=activeYrs[0]||1;

  SIM_SECS.forEach(sec=>{
    let isOpen=!_collapsedSecs.has(sec.t);
    let h=document.createElement('div');h.style.cssText='font-size:11px;font-weight:600;color:#333;margin:12px 0 6px;padding-bottom:3px;border-bottom:2px solid '+sec.c+';cursor:pointer;display:flex;justify-content:space-between;align-items:center';
    h.innerHTML='<span>'+(isOpen?'▼':'▶')+' '+sec.t+'</span><span style="font-size:9px;color:#aaa;font-weight:400">'+sec.v.length+'개 변수</span>';
    h.onclick=function(){if(_collapsedSecs.has(sec.t))_collapsedSecs.delete(sec.t);else _collapsedSecs.add(sec.t);_buildSliders()};
    bd.appendChild(h);
    let secBody=document.createElement('div');secBody.style.display=isOpen?'block':'none';
    bd.appendChild(secBody);
    sec.v.forEach(vr=>{
      let val=SV[vr.k][dispYr],def=DEFAULTS_S[vr.k][dispYr];
      let anyChanged=false;
      for(let j=0;j<7;j++){if(Math.abs(SV[vr.k][j]-DEFAULTS_S[vr.k][j])>1e-8)anyChanged=true}

      let row=document.createElement('div');row.style.marginBottom='12px';

      // Label
      let lbl=document.createElement('div');lbl.style.cssText='display:flex;justify-content:space-between;font-size:10px;color:#666;margin-bottom:2px';
      let vs=document.createElement('span');vs.style.cssText='font-family:Arial,sans-serif;font-weight:500;color:#333';
      vs.textContent=_sfv(val,vr);
      let yrLabel=activeYrs.length===1?' ('+YRS[activeYrs[0]]+'년)':' ('+activeYrs.length+'개년)';
      lbl.innerHTML='<span>'+vr.l+'<span style="font-size:8px;color:#aaa">'+yrLabel+'</span>'+(anyChanged?' <span style="font-size:9px;color:#EF9F27;cursor:pointer;font-weight:500" class="_rst" data-k="'+vr.k+'">기본값</span>':'')+'</span>';
      lbl.appendChild(vs);row.appendChild(lbl);

      // Single/multi year slider
      let trk=document.createElement('div');trk.style.cssText='position:relative;height:18px;display:flex;align-items:center';
      if(def>=vr.min&&def<=vr.max){let mk=document.createElement('div');mk.style.cssText='position:absolute;top:50%;width:2px;height:10px;background:#EF9F27;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:1;left:'+((def-vr.min)/(vr.max-vr.min)*100)+'%';trk.appendChild(mk)}
      let rng=document.createElement('input');rng.type='range';rng.min=vr.min;rng.max=vr.max;rng.step=vr.step;rng.value=val;
      rng.style.cssText='width:100%;margin:0;-webkit-appearance:none;appearance:none;height:4px;background:#e0e0e0;border-radius:2px;outline:none';
      trk.appendChild(rng);row.appendChild(trk);

      rng.addEventListener('input',function(){
        let newVal=+this.value;
        activeYrs.forEach(j=>{SV[vr.k][j]=newVal});
        vs.textContent=_sfv(newVal,vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });

      // Bulk ±% slider
      let bulkRow=document.createElement('div');bulkRow.style.cssText='display:flex;align-items:center;gap:6px;margin-top:4px';
      let bulkLabel=document.createElement('span');bulkLabel.style.cssText='font-size:9px;color:#aaa;white-space:nowrap';bulkLabel.textContent='±%';
      let bulkVal=document.createElement('span');bulkVal.style.cssText='font-size:9px;font-family:Arial,sans-serif;color:#555;min-width:36px;text-align:center';bulkVal.textContent='±0%';
      let bulkRng=document.createElement('input');bulkRng.type='range';bulkRng.min='-50';bulkRng.max='100';bulkRng.step='1';bulkRng.value='0';
      bulkRng.style.cssText='flex:1;margin:0;-webkit-appearance:none;appearance:none;height:3px;background:linear-gradient(to right,#E24B4A 0%,#e0e0e0 50%,#0F6E56 100%);border-radius:2px;outline:none';
      let bulkReset=document.createElement('span');bulkReset.style.cssText='font-size:9px;color:#aaa;cursor:pointer';bulkReset.textContent='↺';
      bulkRow.appendChild(bulkLabel);bulkRow.appendChild(bulkRng);bulkRow.appendChild(bulkVal);bulkRow.appendChild(bulkReset);
      row.appendChild(bulkRow);

      let bulkBase=null;
      bulkRng.addEventListener('mousedown',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('touchstart',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('input',function(){
        let pct=+this.value;
        bulkVal.textContent=(pct>=0?'+':'')+pct+'%';
        bulkVal.style.color=pct>0?'#0F6E56':pct<0?'#E24B4A':'#555';
        if(!bulkBase)bulkBase=DEFAULTS_S[vr.k].slice();
        activeYrs.forEach(j=>{
          let base=bulkBase[j];
          SV[vr.k][j]=vr.p?Math.max(0,Math.min(vr.max,base*(1+pct/100))):Math.max(vr.min,Math.min(vr.max,Math.round(base*(1+pct/100))));
        });
        rng.value=SV[vr.k][dispYr];
        vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });
      bulkReset.onclick=function(){
        bulkRng.value=0;bulkVal.textContent='±0%';bulkVal.style.color='#555';
        activeYrs.forEach(j=>{SV[vr.k][j]=DEFAULTS_S[vr.k][j]});
        rng.value=SV[vr.k][dispYr];vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_buildSliders();
      };

      // Reset all years for this var
      let rst=lbl.querySelector('._rst');
      if(rst)rst.onclick=function(e){e.stopPropagation();let k=this.dataset.k;for(let j=0;j<7;j++)SV[k][j]=DEFAULTS_S[k][j];simCalc();renderAll();refreshOpenChart();_buildSliders()};

      secBody.appendChild(row);
    });
  });
}

function _resetSim(){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders();_renderCaseBar()}

</script>
</body>
</html>
