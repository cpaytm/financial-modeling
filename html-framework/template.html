<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인터랙티브 추정 모델 — 템플릿</title>
<style>
/* Financial Modeling DS — fonts (Outfit for heading, Pretendard for body). 토큰: design-guide/tokens.js */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
*{margin:0;padding:0;box-sizing:border-box}
/* light.bg #FFFFFF, light.surface #F8F8FA, text.light.primary #0F0F12 */
body{font-family:'Pretendard',-apple-system,sans-serif;background:#F8F8FA;color:#0F0F12;overflow:hidden;height:100vh;width:100vw}
canvas#c{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:100;background:#fff;border:1px solid #ddd;border-radius:6px;padding:6px 12px;font-size:11px;color:#666;box-shadow:0 2px 8px rgba(0,0,0,.06);user-select:none}
.top-bar{top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;max-width:calc(100vw - 28px);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.top-bar button{height:26px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:11px;color:#333;padding:0 10px;font-family:'Pretendard',sans-serif;line-height:24px;white-space:nowrap;flex:0 0 auto}
.top-bar button:hover{background:#F3F4F6}
.top-bar .sep{width:1px;height:18px;background:#ddd;flex:0 0 auto}
.top-bar #selLabel{white-space:nowrap;flex:0 0 auto}
#zoom-label{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto}
.legend{bottom:12px;left:12px;font-size:10px;line-height:1.8}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
.hint{bottom:12px;right:12px;font-size:10px;color:#aaa;text-align:right;line-height:1.6}
.popup-overlay{position:fixed;top:0;left:0;right:0;height:100%;transition:right .3s;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.25)}
.popup-overlay.show{display:flex}
.popup{background:#fff;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.15);padding:24px 28px 20px;min-width:520px;max-width:700px;max-height:85vh;overflow-y:auto;position:relative}
.popup-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:#999;padding:4px}
.popup-close:hover{color:#333}
.popup h3{font-size:14px;font-weight:600;margin-bottom:2px;color:#222}
.popup .popup-sub{font-size:11px;color:#999;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 2px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.chart-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.chart-val{font-size:9px;font-family:Arial,sans-serif;color:#555;font-weight:500;text-align:center;white-space:nowrap}
.chart-yr{font-size:9px;font-family:Arial,sans-serif;color:#aaa;text-align:center}
.chart-bar-wrap:hover .chart-val{color:#222;font-weight:700}
.chart-table{width:100%;border-collapse:collapse;margin-top:10px}
.chart-table th{font-size:9px;color:#aaa;font-weight:400;text-align:right;padding:2px 5px;border-bottom:1px solid #eee}
.chart-table td{font-size:10px;font-family:Arial,sans-serif;text-align:right;padding:2px 5px;color:#444}
.chart-table tr:hover td{background:#F8F8FA}
.chart-unit{font-size:9px;color:#bbb;text-align:right;margin-top:3px}
.ds-section{margin-bottom:14px}
.ds-label{font-size:11px;font-weight:600;color:#444;margin-bottom:6px}
.ds-desc{font-size:10px;color:#999;margin-bottom:8px;line-height:1.5}

#right{width:0;overflow:hidden;transition:width .3s;border-left:1px solid #ddd;background:#fff;display:flex;flex-direction:column;flex-shrink:0}
#right.open{width:400px}
.sp-head{padding:10px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sp-head h3{font-size:13px;font-weight:600;flex:1}
.sp-head button{width:24px;height:24px;border:none;background:none;cursor:pointer;font-size:15px;color:#999;border-radius:4px}
.sp-head button:hover{background:#F3F4F6;color:#333}
.sp-body{flex:1;overflow-y:auto;padding:12px 14px}
.sp-sec{font-size:11px;font-weight:600;color:#333;margin:14px 0 6px;padding-bottom:3px}
.sp-row{margin-bottom:10px}
.sp-label{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-bottom:2px}
.sp-label .sp-val{font-family:Arial,sans-serif;font-weight:500;color:#333}
.sp-track{position:relative;height:18px;display:flex;align-items:center}
.sp-track input[type=range]{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:4px;background:#E5E7EB;border-radius:2px;outline:none}
.sp-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#333;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sp-track .sp-mark{position:absolute;top:50%;width:2px;height:10px;background:#5D68F7;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.sp-yrs{display:flex;gap:2px;margin-bottom:10px}
.sp-yr{flex:1;padding:3px 0;font-size:9px;text-align:center;border:1px solid #E5E7EB;border-radius:3px;background:#fff;cursor:pointer;font-family:Arial,sans-serif;color:#888}
.sp-yr.active{background:#333;color:#fff;border-color:#333}
.sp-rst{font-size:9px;color:#5D68F7;cursor:pointer;font-weight:500}
.sp-rst:hover{text-decoration:underline}

#simPanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#333;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* === 노드 편집 UI (Full 모드) === */
/* 컨텍스트 메뉴 */
.ctx-menu{position:fixed;background:#fff;border:1px solid #E5E5E8;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px 0;font-size:12px;z-index:300;min-width:160px;font-family:'Pretendard',sans-serif}
.ctx-menu-item{padding:7px 14px;cursor:pointer;color:#0F0F12;user-select:none}
.ctx-menu-item:hover{background:#F8F8FA}
.ctx-menu-item.danger{color:#DC2626}
.ctx-menu-sep{height:1px;background:#E5E5E8;margin:4px 0}
/* 편집 폼 */
.edit-form label{display:block;font-size:11px;color:#6B7280;margin:12px 0 4px;font-weight:500}
.edit-form input[type=text],.edit-form select,.edit-form textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid #E5E5E8;border-radius:4px;font-family:'Pretendard',sans-serif;background:#fff;color:#0F0F12;outline:none;box-sizing:border-box}
.edit-form input[type=text]:focus,.edit-form textarea:focus,.edit-form select:focus{border-color:#5D68F7}
.edit-form textarea{font-family:Monaco,Consolas,monospace;font-size:12px;min-height:60px;resize:vertical}
.edit-form .hint{font-size:10px;color:#9CA3AF;margin-top:3px}
.edit-form .error{font-size:11px;color:#DC2626;margin-top:8px;padding:8px 10px;background:#FEF2F2;border:1px solid #FECACA;border-radius:4px;display:none}
.edit-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.edit-actions button{padding:7px 14px;font-size:12px;border-radius:4px;border:1px solid #E5E5E8;background:#fff;color:#0F0F12;cursor:pointer;font-family:'Pretendard',sans-serif;font-weight:500}
.edit-actions button:hover{background:#F8F8FA}
.edit-actions button.primary{background:#5D68F7;color:#fff;border-color:#5D68F7}
.edit-actions button.primary:hover{background:#3332D0}
.edit-actions button.danger{color:#DC2626;border-color:#DC2626}
.edit-actions button.danger:hover{background:#FEF2F2}
</style>
</head>
<body style="display:flex;overflow:hidden;height:100vh">
<div id="treePanel" style="flex:1;position:relative;min-width:0;overflow:hidden"><canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<div class="hud top-bar">
  <button onclick="zoomBtn(-1)">−</button><span id="zoom-label">100%</span><button onclick="zoomBtn(1)">+</button>
  <div class="sep"></div>
  <button onclick="toggleAll(true)">모두 펼치기</button>
  <button onclick="toggleAll(false)">모두 접기</button>
  <button onclick="fitAll()">전체 보기</button>
  <div class="sep"></div>
    <div class="sep"></div>
  <button onclick="showAssumptions()" style="background:#F9FAFB;font-weight:500">가정변수</button>
  <button onclick="showRevTable()" style="background:#F9FAFB;font-weight:500">테이블 보기</button>
  <button onclick="toggleSim()" style="background:#5D68F720;font-weight:500;border-color:#5D68F7;color:#3332D0" id="simBtn">시뮬레이터</button>
  <div class="sep"></div>
  <span id="selLabel" style="font-size:10px;color:#9CA3AF;margin-right:4px;font-weight:500">선택 없음</span>
  <button id="btnAddChild" onclick="addUnderSelected()" disabled style="background:#5D68F7;color:#fff;border-color:#5D68F7;font-weight:500" title="선택 노드를 2개 자식의 연산으로 분해 (예: Q = total × share)">분해</button>

  <button onclick="exportToExcel()" title="현재 모델을 Excel 수식이 박힌 .xlsx로 다운로드">📥 엑셀</button>

  <button onclick="resetToDraft()" title="편집·시뮬레이션 변경을 버리고 초안 상태로 복귀">초안 리셋</button>

<div class="popup-overlay" id="revTableOverlay" onclick="if(event.target===this)closeRevTable()" style="display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);position:fixed;top:0;left:0;right:0;height:100%;z-index:200">
  <div class="popup" style="padding:20px 24px;width:90vw;max-width:960px;max-height:90vh;overflow-y:auto">
    <button class="popup-close" onclick="closeRevTable()">✕</button>
    <h3>P&L 테이블</h3>
    <div class="psub" id="revTableSub">시뮬레이션 결과 기반</div>
    <div id="revTableBody"></div>
  </div>
</div>
<div class="popup-overlay" id="popupOverlay" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popup"><button class="popup-close" onclick="closePopup()">✕</button>
    <h3 id="popupTitle"></h3><div class="popup-sub" id="popupSub"></div><div id="popupBody"></div>
  </div>
</div>
<div class="popup-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="popup" id="editPopup" style="min-width:480px;max-width:580px">
    <button class="popup-close" onclick="closeEdit()">✕</button>
    <h3 id="editTitle">노드 편집</h3>
    <div class="popup-sub" id="editSub"></div>
    <div class="edit-form" id="editBody"></div>
  </div>
</div>
<div class="ctx-menu" id="ctxMenu" style="display:none"></div>
<div class="popup-overlay" id="assumOverlay" onclick="if(event.target===this)closeAssum()" style="display:none">
  <div class="popup" id="assumPopup" style="min-width:760px;max-width:920px;max-height:90vh;overflow-y:auto;padding:24px 20px 20px">
    <button class="popup-close" onclick="closeAssum()">✕</button>
    <h3 style="margin-bottom:4px">탑라인 가정변수 일람</h3>
    <div style="font-size:11px;color:#999;margin-bottom:16px">시나리오 분석 시 변경하는 핵심 입력값. 연도별 하드코딩.</div>
    <div id="assumBody"></div>
  </div>
</div>

<script>
// ============================================================
// 인터랙티브 추정 모델 — 템플릿
//
// html-framework/html_modeling_framework.md의 Part II 구현 청사진. 회사별 데이터·트리·계산식을
// 채워 단일 HTML 산출물로 사용. 엔진(렌더링·UI·시뮬레이터·케이스 관리)은
// 그대로 두고 아래 표시된 5개 블록만 회사에 맞게 수정한다.
//
// 채워야 할 블록:
//   1. YRS          — 시간축 (실적+추정 연도 배열)
//   2. D            — 데이터 객체 (모든 시계열)
//   3. INPUT_KEYS   — 입력 변수 식별
//   4. TREE         — 트리 구조
//   5. P&L 테이블   — showRevTable() 안의 row() 호출
//   6. 가정변수표   — showAssumptions() 안의 sections[]
//   7. DEFAULTS_S   — 기본값 보존
//   8. simCalc()    — 시뮬레이션 엔진
//   9. SIM_SECS     — 슬라이더 정의
// ============================================================

// YRS — 시간축. 첫 항목은 관행상 실적 연도 (시뮬레이터에서 잠금).
// 길이가 모든 D[k].v 및 DEFAULTS_S[k]의 길이와 일치해야 함. 엔진은 YRS.length에 맞춰 자동 동작.
const YRS=['2025','2026','2027','2028','2029','2030','2031'];

// ============================================================
// DATA LAYER — 노드 단일 저장소 (수식 그래프 + 트리 구조 통합)
// 자세한 스키마: html-framework/html_modeling_framework.md §9
//
// 각 노드 스키마:
//   v:       [v_y1, ..., v_yN]   계산된 값 (simCalc이 갱신)
//   u:       '원' | '대' | '%'    단위
//   desc:    '추정 근거·계산식'   설명
//   c:       '#RRGGBB'           차트 색
//   pct:     1                   비율 표시
//
//   label:   '표시명'
//   parent:  '부모 노드 id' | null (root만 null)
//   type:    'input' | 'computed'
//   formula: '수식 문자열' (computed만, type='input'은 SV에서 직접)
//   sub:     '부제'
//   bg,fg,sfg,bdr: 트리 노드 스타일 (computed만)
//
// 수식 문법:
//   - 산술: + - * / ( )
//   - 변수 참조: 다른 노드의 id
//   - 함수: SUM(a,b,...), IF(cond,then,else), MIN/MAX/AVG(a,b,...), PREV(x)
//   - 평가는 연도별 element-wise (모든 변수는 YRS.length 배열)
// ============================================================
const D={
  // ===== Root =====
  root: {
    label:'P&L', sub:'매출 − 비용 = 영업이익',
    parent:null, type:'computed', formula:'op_profit',
    v:[0,0,0,0,0,0,0], u:'원',
    desc:'P&L 전체. bottom line(영업이익)을 표시.',
    bg:'#0F0F12', fg:'#fff', sfg:'#9CA3AF',
  },

  // ===== 매출 (semantic.revenue: primary.900) =====
  rev: {
    label:'매출 합계', sub:'Σ(BM별 매출)',
    parent:'root', type:'computed', formula:'rev_block',
    v:[0,0,0,0,0,0,0], u:'원', c:'#1E2185',
    desc:'매출 합계. 여러 BM이면 sum 형태로 확장 (예: rev_a + rev_b).',
    bg:'#1E2185', fg:'#fff', sfg:'#A1B8FF',
  },
  rev_block: {
    label:'매출 (예시 BM)', sub:'Q × P',
    parent:'rev', type:'computed', formula:'unit_q * unit_price',
    v:[0,0,0,0,0,0,0], u:'원', c:'#3332D0',
    desc:'BM 매출 = 수량 × 단가.',
    bg:'#EDF3FF', fg:'#1E2185', sfg:'#5D68F7', bdr:'#A1B8FF',
  },
  unit_q: {
    label:'수량 (Q)',
    parent:'rev_block', type:'input',
    v:[100,120,150,180,220,260,300], u:'대', c:'#5D68F7',
    desc:'수량 — 예시 입력. Fleet/CAPA/구독자 등으로 대체.',
  },
  unit_price: {
    label:'단가 (P)',
    parent:'rev_block', type:'input',
    v:[1000000,1050000,1100000,1150000,1200000,1250000,1300000], u:'원/대', c:'#7C91FD',
    desc:'단가 — 예시 입력. ASP/ARPU/AOV 등으로 대체.',
  },

  // ===== 비용 (semantic.cost: neutral.700) =====
  total_cost: {
    label:'비용 합계', sub:'변동 + 고정',
    parent:'root', type:'computed', formula:'vc + fc',
    v:[0,0,0,0,0,0,0], u:'원', c:'#374151',
    desc:'총비용 = 변동원가 + 고정비.',
    bg:'#374151', fg:'#fff', sfg:'#D1D5DB',
  },
  vc: {
    label:'변동원가', sub:'Q × 단위원가',
    parent:'total_cost', type:'computed', formula:'unit_q * unit_cost',
    v:[0,0,0,0,0,0,0], u:'원', c:'#4B5563',
    desc:'변동원가 = 수량 × 단위원가. 수량(unit_q)을 매출과 공유.',
    bg:'#F9FAFB', fg:'#374151', sfg:'#6B7280', bdr:'#D1D5DB',
  },
  unit_cost: {
    label:'단위 변동원가',
    parent:'vc', type:'input',
    v:[600000,620000,640000,660000,680000,700000,720000], u:'원/대', c:'#9CA3AF',
    desc:'단위 변동원가 — 매출-비용 공유 드라이버 패턴.',
  },
  fc: {
    label:'고정비',
    parent:'total_cost', type:'input',
    v:[500000000,525000000,550000000,575000000,600000000,625000000,650000000], u:'원', c:'#6B7280',
    desc:'고정비 — 인건비+임차+R&D 등.',
  },

  // ===== 영업이익 (semantic.profit: green-500) =====
  op_profit: {
    label:'영업이익', sub:'= 매출 − 비용',
    parent:'root', type:'computed', formula:'rev - total_cost',
    v:[0,0,0,0,0,0,0], u:'원', c:'#22C55E',
    desc:'영업이익 = 매출 − 비용.',
    bg:'#22C55E', fg:'#fff', sfg:'#86EFAC',
  },
};

// ============================================================
// 파생 인덱스 — D에서 자동 계산. D 편집 시 rebuildIndexes()로 갱신.
// ============================================================
let INPUT_KEYS=new Set();
let TREE=null;
let SIM_SECS=[];  // 초기 빈 배열, buildSimSecs()이 채움 (선언 순서 의존성 회피)

function rebuildIndexes(){
  INPUT_KEYS = new Set(Object.keys(D).filter(k=>D[k].type==='input'));
  TREE = buildTree();
  if(typeof buildSimSecs==='function') SIM_SECS = buildSimSecs();
}

// buildTree() — D의 parent 필드를 따라 시각 트리 구성
function buildTree(){
  let childrenOf={};
  for(let k in D){
    let p=D[k].parent;
    if(p==null||!D[p])continue;
    (childrenOf[p]=childrenOf[p]||[]).push(k);
  }
  function makeNode(id){
    let d=D[id]; if(!d)return null;
    let kids=childrenOf[id]||[];
    let n={id, label:d.label, sub:d.sub, data:id};
    if(d.type==='input'){
      n.drv=1;
    } else {
      n.bg=d.bg; n.fg=d.fg; n.sfg=d.sfg; n.bdr=d.bdr;
    }
    if(kids.length) n.children=kids.map(makeNode).filter(x=>x);
    return n;
  }
  return makeNode('root');
}

let bridgeSelection = []; // stores [yearIdx1, yearIdx2] or [yearIdx1]

function toggleBridgeInline(body,parentSec,yearIdx,barEl){
  bridgeBody = body;
  bridgeParentSec = parentSec;

  let idx = bridgeSelection.indexOf(yearIdx);
  if(idx !== -1){
    // Deselect
    bridgeSelection.splice(idx, 1);
  } else {
    if(bridgeSelection.length === 0){
      bridgeSelection.push(yearIdx);
    } else if(bridgeSelection.length === 1){
      bridgeSelection.push(yearIdx);
      bridgeSelection.sort((a,b)=>a-b);
    } else {
      // Already 2 selected, replace: keep the other one closest, or just reset
      bridgeSelection = [yearIdx];
    }
  }

  // Update bar highlights
  parentSec.querySelectorAll('.chart-bar-wrap').forEach((w,i)=>{
    if(bridgeSelection.includes(i)){
      w.style.outline='2px solid #333';
      w.style.outlineOffset='2px';
      w.style.borderRadius='4px';
    } else {
      w.style.outline='none';
    }
  });

  // Remove existing bridge
  let existing = document.getElementById('inlineBridge');
  if(existing) existing.remove();

  if(bridgeSelection.length === 0) return;

  let fi, ti;
  if(bridgeSelection.length === 1){
    fi = bridgeSelection[0];
    ti = fi + 1;
    if(ti > 6) { ti = 6; fi = 5; }
  } else {
    fi = bridgeSelection[0];
    ti = bridgeSelection[1];
  }

  renderBridge(fi, ti, parentSec);
}

function renderBridge(fi, ti, parentSec){
  // ============================================================
  // 브릿지(워터폴) 데이터 — 회사별로 채움
  // 매출을 분해하는 BM(사업부)별 시계열 + 합계 시계열.
  // BMS의 합 = TOT 가 매년 일치해야 함.
  // 색상은 DS 토큰 (primary scale + neutrals) 사용 권장.
  // ============================================================
  const BMS={
    '예시 BM':{v:D.rev.v.slice(), c:'#1E2185'},  // semantic.revenue (회사별로 여러 BM으로 분해)
  };
  const TOT=D.rev.v.slice();
  const bnames=Object.keys(BMS);
  const bfmt=v=>{let a=Math.abs(v),s=v<0?'-':'';if(a>=1e12)return s+(a/1e12).toFixed(1)+'조';if(a>=1e8)return s+(a/1e8).toFixed(0)+'억';if(a>=1e7)return s+(a/1e7).toFixed(0)+'천만';return s+Math.round(a/1e6)+'백만'};

  let fromTotal=TOT[fi], toTotal=TOT[ti];
  let deltas=bnames.map(n=>BMS[n].v[ti]-BMS[n].v[fi]);
  let totalDelta=toTotal-fromTotal;

  let bridge=document.createElement('div');
  bridge.id='inlineBridge';
  bridge.style.cssText='margin:16px 0 8px;padding:16px;background:var(--color-background-secondary,#F9FAFB);border-radius:8px;border:0.5px solid var(--color-border-tertiary,#ddd)';

  let title=document.createElement('div');
  title.style.cssText='font-size:12px;font-weight:600;color:var(--color-text-primary,#333);margin-bottom:12px';
  title.textContent=YRS[fi]+'년 → '+YRS[ti]+'년 매출 브릿지  ('+(totalDelta>=0?'+':'')+bfmt(totalDelta)+')';
  bridge.appendChild(title);

  // Canvas
  let canvasWrap=document.createElement('div');
  canvasWrap.style.cssText='position:relative;width:100%;height:260px';
  let cvs=document.createElement('canvas');
  canvasWrap.appendChild(cvs);
  bridge.appendChild(canvasWrap);

  // Table
  let tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;margin-top:8px';
  let thead=document.createElement('tr');
  thead.innerHTML='<th style="text-align:left;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">BM</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">'+YRS[fi]+'</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">'+YRS[ti]+'</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">증감</th><th style="text-align:right;font-size:10px;color:#aaa;padding:3px 6px;font-weight:400">비중</th>';
  tbl.appendChild(thead);
  bnames.forEach((n,i)=>{
    let d=deltas[i];
    let pct=totalDelta!==0?Math.round(d/totalDelta*100):0;
    let dcol=d>=0?BMS[n].c:'#DC2626';
    let tr=document.createElement('tr');
    tr.innerHTML='<td style="font-size:11px;padding:3px 6px;color:#444"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+dcol+';margin-right:6px;vertical-align:middle"></span>'+n+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:#888;font-family:Arial,sans-serif">'+bfmt(BMS[n].v[fi])+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:#888;font-family:Arial,sans-serif">'+bfmt(BMS[n].v[ti])+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:'+(d>=0?'#333':'#DC2626')+';font-family:Arial,sans-serif;font-weight:500">'+(d>=0?'+':'')+bfmt(d)+'</td>'
      +'<td style="font-size:11px;padding:3px 6px;text-align:right;color:#888;font-family:Arial,sans-serif">'+pct+'%</td>';
    tbl.appendChild(tr);
  });
  let totRow=document.createElement('tr');
  totRow.innerHTML='<td style="font-size:11px;padding:5px 6px;color:#222;font-weight:600;border-top:1px solid #ddd">합계</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#222;font-weight:600;border-top:1px solid #ddd;font-family:Arial,sans-serif">'+bfmt(fromTotal)+'</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#222;font-weight:600;border-top:1px solid #ddd;font-family:Arial,sans-serif">'+bfmt(toTotal)+'</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#222;font-weight:600;border-top:1px solid #ddd;font-family:Arial,sans-serif">'+(totalDelta>=0?'+':'')+bfmt(totalDelta)+'</td>'
    +'<td style="font-size:11px;padding:5px 6px;text-align:right;color:#888;border-top:1px solid #ddd;font-family:Arial,sans-serif">100%</td>';
  tbl.appendChild(totRow);
  bridge.appendChild(tbl);

  parentSec.parentNode.insertBefore(bridge,parentSec.nextSibling);

  // Build waterfall items
  let items=[];
  items.push({label:YRS[fi].slice(2)+'년',val:fromTotal,color:'#1E2185',isTotal:true});
  let running=fromTotal;
  bnames.forEach((n,i)=>{
    let d=deltas[i];
    if(Math.abs(d)<1)return;
    items.push({label:n,val:d,color:d>=0?BMS[n].c:'#DC2626',isTotal:false,base:d>=0?running:running+d});
    running+=d;

  setTimeout(()=>{
    let labels_b=items.map(it=>it.label);

        plugins:{legend:{display:false},tooltip:{enabled:false}},

          x:{stacked:true,grid:{display:false},ticks:{font:{size:10}}},
          y:{stacked:true,display:false}
        },
        animation:{duration:300},layout:{padding:{top:20}}
      },
      plugins:[{
        id:'vl2',afterDraw(ch){
          let ctx2=ch.ctx,meta=ch.getDatasetMeta(1);ctx2.save();
          meta.data.forEach((bar,i)=>{
            let v=tops_b[i];if(!v||v<1e6)return;

      }]
    });
  },50);
}

  function _walkPL(id, indent, parentGroup){

function s2w(sx,sy){return{x:(sx-cam.x)/cam.s,y:(sy-cam.y)/cam.s}}
function hitTest(sx,sy){let w=s2w(sx,sy);for(let i=allNodes.length-1;i>=0;i--){let n=allNodes[i],p=getPos(n.id);if(!p)continue;if(w.x>=p.x&&w.x<=p.x+p.w&&w.y>=p.y&&w.y<=p.y+p.h){let inChart=n.data&&D[n.data]&&w.x>=p.x+p.w-ICON_W&&w.y<=p.y+24;return{node:n,isChart:inChart}}}return null}
function canToggle(n){return n.children&&n.children.length>0}
let drag=false,dragStart={x:0,y:0},camStart={x:0,y:0},clickStart=null;
let nodeDrag=null; // {nodeId, startX, startY}
let nodeOffsets={}; // {nodeId: {dx, dy}}

function resize(){let _tp=document.getElementById("treePanel");W=_tp?_tp.clientWidth:window.innerWidth;H=_tp?_tp.clientHeight:window.innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';renderAll()}
window.addEventListener('resize',resize);
cvs.addEventListener('pointerdown',e=>{
  clickStart={x:e.clientX,y:e.clientY,t:Date.now()};
  cvs.setPointerCapture(e.pointerId);
  let hit=hitTest(e.clientX,e.clientY);
  if(hit&&!hit.isChart){
    // Potential node drag - don't start yet, wait for movement threshold
    let w=s2w(e.clientX,e.clientY);
    let p=getPos(hit.node.id);
    nodeDrag={id:hit.node.id,ox:w.x-p.x,oy:w.y-p.y,active:false};
    drag=false;
  } else {
    nodeDrag=null;
    drag=true;dragStart={x:e.clientX,y:e.clientY};camStart={x:cam.x,y:cam.y};
  }
});
cvs.addEventListener('pointermove',e=>{
  if(nodeDrag){
    let dist=Math.abs(e.clientX-clickStart.x)+Math.abs(e.clientY-clickStart.y);
    if(!nodeDrag.active&&dist<8)return; // threshold not met, wait
    nodeDrag.active=true; // now it's a real drag
    cvs.style.cursor='grabbing';
    let w=s2w(e.clientX,e.clientY);
    let baseP=positions[nodeDrag.id];
    if(baseP){
      // Only update THIS node's offset. Children inherit via getPos ancestor chain.
      // But we need to account for ancestor offsets when computing the target
      let ancestorDx=0,ancestorDy=0,cur=parentMap[nodeDrag.id];
      while(cur){let o=nodeOffsets[cur];if(o){ancestorDx+=o.dx;ancestorDy+=o.dy}cur=parentMap[cur]}
      if(!nodeOffsets[nodeDrag.id])nodeOffsets[nodeDrag.id]={dx:0,dy:0};
      nodeOffsets[nodeDrag.id].dx=w.x-nodeDrag.ox-baseP.x-ancestorDx;
      nodeOffsets[nodeDrag.id].dy=w.y-nodeDrag.oy-baseP.y-ancestorDy;
      renderAll();
    }
    return;
  }
  if(drag){cam.x=camStart.x+(e.clientX-dragStart.x);cam.y=camStart.y+(e.clientY-dragStart.y);renderAll()}
  let hit=hitTest(e.clientX,e.clientY);
  let nh=hit?hit.node.id:null;let nc=hit&&hit.isChart?hit.node.id:null;
  if(nh!==hoverId||nc!==hoverChart){hoverId=nh;hoverChart=nc;cvs.style.cursor=nc?'pointer':(nh?'grab':'default');renderAll()}
});
cvs.addEventListener('pointerup',e=>{
  drag=false;
  if(clickStart&&Math.abs(e.clientX-clickStart.x)<5&&Math.abs(e.clientY-clickStart.y)<5&&Date.now()-clickStart.t<300){
    let hit=hitTest(e.clientX,e.clientY);
    if(hit){
      if(hit.isChart){
        showChart(hit.node);
      } else {
        // 노드 본문 클릭 → 선택 + 펼침/접힘
        selectedId=hit.node.id;

          if(openSet.has(hit.node.id)) openSet.delete(hit.node.id);
          else openSet.add(hit.node.id);
        }
        renderAll();
      }
    } else {
      // 빈 영역 클릭 → 선택 해제
      selectedId=null;
      updateSelectedToolbar();
      renderAll();
    }
  }
  clickStart=null;
});
cvs.addEventListener('wheel',e=>{e.preventDefault();let f=e.deltaY<0?1.08:1/1.08;let ns=Math.max(0.15,Math.min(4,cam.s*f));let wx=(e.clientX-cam.x)/cam.s,wy=(e.clientY-cam.y)/cam.s;cam.s=ns;cam.x=e.clientX-wx*cam.s;cam.y=e.clientY-wy*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()},{passive:false});

function fitAll(){nodeOffsets={};allNodes=[];positions={};doLayout(TREE,PAD,PAD);let minX=1e9,minY=1e9,maxX=0,maxY=0;Object.values(positions).forEach(p=>{if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;if(p.x+p.w>maxX)maxX=p.x+p.w;if(p.y+p.h>maxY)maxY=p.y+p.h});maxX+=40;maxY+=40;let tw=maxX-minX+PAD*2,th=maxY-minY+PAD*2;cam.s=Math.min(W/tw,H/th,2)*.9;cam.x=W/2-(minX+maxX)/2*cam.s;cam.y=H/2-(minY+maxY)/2*cam.s;document.getElementById('zoom-label').textContent=Math.round(cam.s*100)+'%';renderAll()}

function applyLeafEdit(id){
  let d=D[id]; if(!d) return;
  let label=document.getElementById('_e_label').value.trim();
  let type=document.getElementById('_e_type').value;
  let formula=document.getElementById('_e_formula').value.trim();
  let unit=document.getElementById('_e_unit').value.trim();
  let desc=document.getElementById('_e_desc').value.trim();
  if(!label){ _editErr('_e_err','표시명 필수'); return; }
  if(type==='computed'){
    if(!formula){ _editErr('_e_err','계산 노드는 수식 필요'); return; }
    try{ parseFormula(formula); } catch(e){ _editErr('_e_err',e.message); return; }
  }
  if(id==='root' && type!=='computed'){ _editErr('_e_err','루트는 computed 타입만 가능'); return; }
  d.label=label;
  d.type=type;
  d.formula=type==='computed'?formula:null;
  d.u=unit||'원';
  d.desc=desc;
  if(type==='input'){
    if(!SV[id]) SV[id]=(d.v||Array(YRS.length).fill(0)).slice();
    if(!DEFAULTS_S[id]) DEFAULTS_S[id]=SV[id].slice();
  }
  _afterEdit();
}

function applyDecompEdit(id){
  let d=D[id]; if(!d) return;
  let label=document.getElementById('_e_label').value.trim();
  let formula=document.getElementById('_e_formula').value.trim();
  let unit=document.getElementById('_e_unit').value.trim();
  let desc=document.getElementById('_e_desc').value.trim();
  if(!label){ _editErr('_e_err','표시명 필수'); return; }
  if(!formula){ _editErr('_e_err','수식 필수'); return; }

  // 기존 자식 검증
  for(let c of _editExisting){
    if(!c.deleted && !c.label){ _editErr('_e_err','자식 "'+c.id+'" 표시명 필수'); return; }
  }
  // 새 자식 검증
  let rx=/^[a-zA-Z_][a-zA-Z_0-9]*$/;
  let allIds=new Set(Object.keys(D));
  _editExisting.filter(c=>c.deleted).forEach(c=>allIds.delete(c.id));
  for(let i=0;i<_editNew.length;i++){
    let c=_editNew[i];
    if(!c.id){ _editErr('_e_err','새 자식 '+(i+1)+': ID 필수'); return; }
    if(!rx.test(c.id)){ _editErr('_e_err','새 자식 '+(i+1)+': ID 형식 오류 ('+c.id+')'); return; }
    if(allIds.has(c.id)){ _editErr('_e_err','이미 존재하는 ID: '+c.id); return; }
    if(!c.label){ _editErr('_e_err','새 자식 '+(i+1)+': 표시명 필수'); return; }
    allIds.add(c.id);
  }

  // 수식 검증
  let ast;
  try{ ast=parseFormula(formula); } catch(e){ _editErr('_e_err','수식: '+e.message); return; }
  let deps=extractDeps(ast);
  for(let dep of deps){
    if(!allIds.has(dep)){ _editErr('_e_err','미정의 변수 참조: '+dep); return; }
  }

  // 적용 — 기존 자식 업데이트
  for(let c of _editExisting){
    if(c.deleted){
      // cascade 삭제
      function _cascade(k){
        Object.keys(D).filter(x=>D[x].parent===k).forEach(_cascade);
        delete D[k]; delete SV[k]; delete DEFAULTS_S[k];
      }
      _cascade(c.id);
    } else {
      let cd=D[c.id];
      if(cd){ cd.label=c.label; cd.u=c.unit||'원'; }
    }
  }
  // 새 자식 생성 (모두 input)
  let palette=['#5D68F7','#7C91FD','#A1B8FF','#9CA3AF','#6B7280','#3332D0'];
  let existingKidCount=_editExisting.filter(c=>!c.deleted).length;
  _editNew.forEach((c,i)=>{
    let arr=Array(YRS.length).fill(c.val);
    D[c.id]={label:c.label, parent:id, type:'input', v:arr, u:c.unit||'원', desc:'', c:palette[(existingKidCount+i)%palette.length]};
    SV[c.id]=arr.slice(); DEFAULTS_S[c.id]=arr.slice();
  });
  // 부모 업데이트
  d.label=label;
  d.formula=formula;
  d.sub=formula;
  d.u=unit||'원';
  d.desc=desc;
  d.type='computed';
  _afterEdit();
}

    <div style="display:grid;grid-template-columns:110px 1fr 70px 90px 24px;gap:6px;padding:0 8px 4px;font-size:10px;color:#9CA3AF">

function applyAddChild(parentId){
  let formula=document.getElementById('_a_formula').value.trim();
  if(!formula){ _editErr('_a_err','수식 필수'); return; }

  // 자식 유효성 검사
  let rx=/^[a-zA-Z_][a-zA-Z_0-9]*$/;
  if(_decompChildren.length<1){ _editErr('_a_err','자식이 최소 1개 필요'); return; }
  let seen=new Set();
  for(let i=0;i<_decompChildren.length;i++){
    let c=_decompChildren[i];
    if(!c.id){ _editErr('_a_err','자식 '+(i+1)+': ID 필수'); return; }
    if(!rx.test(c.id)){ _editErr('_a_err','자식 '+(i+1)+': ID 형식 오류 ('+c.id+')'); return; }
    if(D[c.id]){ _editErr('_a_err','이미 존재하는 ID: '+c.id); return; }
    if(seen.has(c.id)){ _editErr('_a_err','중복 ID: '+c.id); return; }
    if(!c.label){ _editErr('_a_err','자식 '+(i+1)+': 표시명 필수'); return; }
    seen.add(c.id);
  }

  // 수식 검증 — syntax + 변수 참조 (새 자식 또는 기존 노드)
  let ast;
  try{ ast=parseFormula(formula); } catch(e){ _editErr('_a_err','수식 파싱: '+e.message); return; }
  let deps=extractDeps(ast);
  for(let dep of deps){
    if(!D[dep] && !seen.has(dep)){
      _editErr('_a_err','미정의 변수 참조: '+dep+' (자식으로 추가하거나 오타 확인)');
      return;
    }
  }

  // 자식 생성 (모두 input)
  let palette=['#5D68F7','#7C91FD','#A1B8FF','#9CA3AF','#6B7280','#3332D0'];
  _decompChildren.forEach((c,i)=>{
    let arr=Array(YRS.length).fill(c.val);
    D[c.id]={label:c.label, parent:parentId, type:'input', v:arr, u:c.unit||'원', desc:'', c:palette[i%palette.length]};
    SV[c.id]=arr.slice();
    DEFAULTS_S[c.id]=arr.slice();
  });

  // 부모를 computed로 전환
  let p=D[parentId];
  p.type='computed';
  p.formula=formula;
  p.sub=formula;
  if(!p.bg){ p.bg='#F9FAFB'; p.fg='#374151'; p.sfg='#6B7280'; p.bdr='#D1D5DB'; }
  delete SV[parentId]; delete DEFAULTS_S[parentId];

  _afterEdit();
}

function deleteNodeUI(id){
  if(id==='root') return;
  hideCtxMenu();
  let kids=Object.keys(D).filter(k=>D[k].parent===id);
  let deps=[];
  for(let k in D){
    let d=D[k]; if(!d.formula) continue;
    try{ if(extractDeps(parseFormula(d.formula)).has(id)) deps.push(k); } catch(e){}
  }
  let msg='"'+(D[id].label||id)+'" 삭제';
  if(kids.length) msg+='\n자식 '+kids.length+'개도 함께 삭제';
  if(deps.length) msg+='\n경고: '+deps.length+'개 노드가 이 변수를 참조 (수식 에러로 표시됨): '+deps.join(', ');
  msg+='\n\n계속하시겠습니까?';
  if(!confirm(msg)) return;
  function cascade(k){
    Object.keys(D).filter(c=>D[c].parent===k).forEach(cascade);
    delete D[k]; delete SV[k]; delete DEFAULTS_S[k];
  }
  cascade(id);
  closeEdit();
  _afterEdit();
}

// 편집 후 공통 작업
function _afterEdit(){
  clearFormulaCache();
  rebuildIndexes();
  if(typeof saveToStorage==='function') saveToStorage();
  simCalc();
  // 삭제 후 selectedId가 사라진 노드 가리키면 클리어
  if(selectedId && !D[selectedId]) selectedId=null;
  updateSelectedToolbar();
  renderAll();
  closeEdit();
  // 시뮬레이터 패널이 열려있으면 재빌드
  if(typeof _buildSliders==='function'){
    let sp=document.getElementById('simPanel');
    if(sp && sp.style.width==='400px') _buildSliders();
  }
}

// 컨텍스트 메뉴 (우클릭)
function showCtxMenu(x,y,node){
  let menu=document.getElementById('ctxMenu');
  let isRoot=node.id==='root';
  let already=hasChildren(node.id);
  menu.innerHTML=
    '<div class="ctx-menu-item" onclick="showEditModal(\''+node.id+'\')">편집'+(already?' (분해 구조)':'')+'</div>'+
    (already
      ? '<div class="ctx-menu-item" style="color:#D1D5DB;cursor:not-allowed" title="이미 분해됨">분해 (이미 분해됨)</div>'
      : '<div class="ctx-menu-item" onclick="showAddChildModal(\''+node.id+'\')">분해</div>')+
    (isRoot?'':'<div class="ctx-menu-sep"></div><div class="ctx-menu-item danger" onclick="deleteNodeUI(\''+node.id+'\')">삭제</div>');
  menu.style.left=Math.min(x,window.innerWidth-180)+'px';
  menu.style.top=Math.min(y,window.innerHeight-200)+'px';
  menu.style.display='block';
}
function hideCtxMenu(){document.getElementById('ctxMenu').style.display='none'}

// 캔버스 우클릭으로 메뉴 표시
cvs.addEventListener('contextmenu',function(e){
  e.preventDefault();
  let hit=hitTest(e.clientX,e.clientY);
  if(hit) showCtxMenu(e.clientX,e.clientY,hit.node);
  else hideCtxMenu();
});
// 외부 클릭으로 메뉴 닫기
document.addEventListener('click',function(e){

// ============================================================
// DEFAULTS_S — 입력 변수의 기본값
// SV (현재 슬라이더 상태)와 비교 기준. 슬라이더의 주황색 마크 위치.
// "기본값" 버튼은 SV ← DEFAULTS_S 복사.
//
// INPUT_KEYS에 등록한 모든 변수가 여기에 있어야 함.
// 결과 변수는 simCalc()이 계산하므로 여기 둘 필요 없음.
// ============================================================
const DEFAULTS_S={
  unit_q:    [100,120,150,180,220,260,300],
  unit_price:[1000000,1050000,1100000,1150000,1200000,1250000,1300000],
  unit_cost: [600000,620000,640000,660000,680000,700000,720000],
  fc:        [500000000,525000000,550000000,575000000,600000000,625000000,650000000],
};

// ============================================================
// 수식 엔진 (Full 모드 — 동적 노드 편집)
//
// 흐름:
//   1) D[k].formula 문자열 → tokenize → parse → AST (캐시)
//   2) AST에서 의존 변수 추출 (캐시)
//   3) 토폴로지 정렬로 평가 순서 결정 (순환참조 검출)
//   4) 순서대로 evalAst → D[k].v 갱신
//
// 수식 문법:
//   산술:       + - * /  (괄호 지원)
//   비교:       == != < > <= >=
//   함수:       SUM(a,b,..)  MIN/MAX/AVG  IF(c,t,e)  PREV(x)
//   변수 참조:  다른 노드의 id (e.g. unit_q)
//   값은 모두 길이 YRS.length 배열, 연도별 element-wise 평가.
// ============================================================

// ----- Tokenizer -----
function tokenize(s){
  let i=0, t=[];
  while(i<s.length){
    let c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/\d/.test(c) || (c==='.' && /\d/.test(s[i+1]))){
      let m=s.slice(i).match(/^\d*\.?\d+([eE][-+]?\d+)?/);
      t.push({type:'num',val:parseFloat(m[0])}); i+=m[0].length; continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let m=s.slice(i).match(/^[a-zA-Z_][a-zA-Z_0-9]*/);
      t.push({type:'ident',val:m[0]}); i+=m[0].length; continue;
    }
    if('+-*/(),'.includes(c)){ t.push({type:'op',val:c}); i++; continue; }
    if((c==='='||c==='!') && s[i+1]==='='){ t.push({type:'cmp',val:c+'='}); i+=2; continue; }
    if(c==='<'||c==='>'){
      if(s[i+1]==='='){ t.push({type:'cmp',val:c+'='}); i+=2; }
      else { t.push({type:'cmp',val:c}); i++; }
      continue;
    }
    throw new Error('알 수 없는 문자: '+c);
  }
  return t;
}

// ----- Parser (recursive descent) -----
function parseFormula(s){
  let tokens=tokenize(s), pos=0;
  function peek(){ return tokens[pos]; }
  function eat(type,val){
    let tk=tokens[pos];
    if(!tk||tk.type!==type||(val!==undefined&&tk.val!==val))
      throw new Error('파싱 오류: "'+(tk?tk.val:'끝')+'" — '+(val||type)+' 기대');
    pos++; return tk;
  }
  function parseExpr(){ return parseCmp(); }
  function parseCmp(){
    let l=parseSum();
    while(peek()&&peek().type==='cmp'){
      let op=eat('cmp').val, r=parseSum();
      l={kind:'cmp',op,l,r};
    }
    return l;
  }
  function parseSum(){
    let l=parseTerm();
    while(peek()&&(peek().val==='+'||peek().val==='-')){
      let op=eat('op').val, r=parseTerm();
      l={kind:'bin',op,l,r};
    }
    return l;
  }
  function parseTerm(){
    let l=parseFactor();
    while(peek()&&(peek().val==='*'||peek().val==='/')){
      let op=eat('op').val, r=parseFactor();
      l={kind:'bin',op,l,r};
    }
    return l;
  }
  function parseFactor(){
    let t=peek();
    if(!t) throw new Error('수식이 비어있음');
    if(t.val==='-'){ eat('op'); return {kind:'neg',x:parseFactor()}; }
    if(t.val==='('){ eat('op','('); let e=parseExpr(); eat('op',')'); return e; }
    if(t.type==='num'){ eat('num'); return {kind:'num',val:t.val}; }
    if(t.type==='ident'){
      eat('ident');
      if(peek()&&peek().val==='('){
        eat('op','(');
        let args=[];
        if(peek()&&peek().val!==')'){
          args.push(parseExpr());
          while(peek()&&peek().val===','){ eat('op'); args.push(parseExpr()); }
        }
        eat('op',')');
        return {kind:'fn',name:t.val,args};
      }
      return {kind:'ref',name:t.val};
    }
    throw new Error('파싱 오류: 예기치 못한 토큰 "'+t.val+'"');
  }
  let ast=parseExpr();
  if(peek()) throw new Error('수식 뒤에 잉여 토큰: "'+peek().val+'"');
  return ast;
}

// ----- 의존 변수 추출 -----
function extractDeps(ast, set){
  if(!set) set=new Set();
  if(!ast) return set;
  if(ast.kind==='ref') set.add(ast.name);
  if(ast.l) extractDeps(ast.l,set);
  if(ast.r) extractDeps(ast.r,set);
  if(ast.x) extractDeps(ast.x,set);
  if(ast.args) ast.args.forEach(a=>extractDeps(a,set));
  return set;
}

// ----- 평가 (element-wise on length YRS.length) -----
function evalAst(ast, env){
  let N=YRS.length;
  switch(ast.kind){
    case 'num': return Array(N).fill(ast.val);
    case 'ref': {
      let v=env[ast.name];
      if(v===undefined) throw new Error('미정의 변수: '+ast.name);
      return v.slice();
    }
    case 'neg': return evalAst(ast.x,env).map(v=>-v);
    case 'bin': {
      let a=evalAst(ast.l,env), b=evalAst(ast.r,env);
      return a.map((x,i)=>{
        let y=b[i];
        switch(ast.op){
          case '+': return x+y;
          case '-': return x-y;
          case '*': return x*y;
          case '/': return y===0?0:x/y;
        }
      });
    }
    case 'cmp': {
      let a=evalAst(ast.l,env), b=evalAst(ast.r,env);
      return a.map((x,i)=>{
        let y=b[i];
        switch(ast.op){
          case '==': return x===y?1:0;
          case '!=': return x!==y?1:0;
          case '<':  return x<y?1:0;
          case '>':  return x>y?1:0;
          case '<=': return x<=y?1:0;
          case '>=': return x>=y?1:0;
        }
      });
    }
    case 'fn': {
      let args=ast.args.map(a=>evalAst(a,env));
      let fn=ast.name.toUpperCase();
      switch(fn){
        case 'SUM':  return Array(N).fill(0).map((_,i)=>args.reduce((s,a)=>s+a[i],0));
        case 'MIN':  return Array(N).fill(0).map((_,i)=>Math.min(...args.map(a=>a[i])));
        case 'MAX':  return Array(N).fill(0).map((_,i)=>Math.max(...args.map(a=>a[i])));
        case 'AVG':  return Array(N).fill(0).map((_,i)=>args.reduce((s,a)=>s+a[i],0)/args.length);
        case 'IF':
          if(args.length!==3) throw new Error('IF는 3개 인자 필요');
          return Array(N).fill(0).map((_,i)=>args[0][i]?args[1][i]:args[2][i]);
        case 'PREV':
          if(args.length!==1) throw new Error('PREV는 1개 인자 필요');
          return Array(N).fill(0).map((_,i)=>i===0?0:args[0][i-1]);
        default: throw new Error('미정의 함수: '+ast.name);
      }
    }
  }
  throw new Error('알 수 없는 AST');
}

// ----- 토폴로지 정렬 -----
function topoSort(){
  let order=[], visited=new Set(), visiting=new Set();
  function visit(k, path){
    if(visited.has(k)) return;
    if(visiting.has(k)){
      throw new Error('순환 참조: '+[...path,k].join(' → '));
    }
    visiting.add(k);
    let d=D[k];
    if(d && d.type==='computed' && d.formula){
      try{
        if(!d._ast) d._ast=parseFormula(d.formula);
        if(!d._deps) d._deps=extractDeps(d._ast);
        for(let dep of d._deps){
          if(D[dep]) visit(dep, [...path, k]);
        }
        d._error=null;
      } catch(e){
        d._error=e.message;
      }
    }
    visiting.delete(k);
    visited.add(k);
    order.push(k);
  }
  for(let k in D){
    try{ visit(k, []); } catch(e){ if(D[k]) D[k]._error=e.message; }
  }
  return order;
}

// ----- 메인 simCalc (generic evaluator) -----
function simCalc(){
  let order=topoSort();
  let env={};
  // 입력값: SV → env, D.v
  for(let k in D){
    if(D[k].type==='input'){
      let v=(SV[k]||D[k].v||[]).slice();
      // YRS 길이에 맞추기
      while(v.length<YRS.length) v.push(0);
      v.length=YRS.length;
      env[k]=v;
      D[k].v=v;
    }
  }
  // 평가 순서대로 computed 노드 계산
  for(let k of order){
    let d=D[k];
    if(!d||d.type!=='computed') continue;
    if(!d._ast){
      // 파싱 실패 — 이전 값 유지
      continue;
    }
    try{
      let v=evalAst(d._ast, env);
      env[k]=v;
      d.v=v;
      d._error=null;
    } catch(e){
      d._error=e.message;
      env[k]=d.v;  // 이전 값 유지
    }
  }
  // 변경 자동 저장 (debounced 300ms)
  if(typeof saveToStorage==='function') saveToStorage();
}

// 캐시 무효화 — formula·D 구조 변경 시 호출
function clearFormulaCache(){
  for(let k in D){
    delete D[k]._ast;
    delete D[k]._deps;
  }
}

// ============================================================
// 엑셀 다운로드 — 수식 그대로 박힌 .xlsx 생성 (SheetJS 사용)
//
// 레이아웃:
//   A: Variable ID  |  B: Label  |  C: Unit  |  D..: 연도별 값/수식
//   - input 노드: 값 리터럴
//   - computed 노드: Excel formula (변수 참조 = 해당 변수 행의 같은 연도 열)
// ============================================================
function _colLetter(idx){
  // 0=A, 25=Z, 26=AA, ...
  let r=''; let n=idx;
  while(n>=0){ r=String.fromCharCode(65+n%26)+r; n=Math.floor(n/26)-1; }
  return r;
}

function astToExcel(ast, year, rowMap){
  function _ref(name, yr){
    let row=rowMap[name];
    if(!row) throw new Error('미정의 변수: '+name);
    return _colLetter(3+yr)+row;  // D=0, E=1, ...
  }
  switch(ast.kind){
    case 'num': return String(ast.val);
    case 'ref': return _ref(ast.name, year);
    case 'neg': return '(-'+astToExcel(ast.x, year, rowMap)+')';
    case 'bin': {
      let l=astToExcel(ast.l, year, rowMap);
      let r=astToExcel(ast.r, year, rowMap);
      return '('+l+ast.op+r+')';
    }
    case 'cmp': {
      let l=astToExcel(ast.l, year, rowMap);
      let r=astToExcel(ast.r, year, rowMap);
      let op=ast.op==='=='?'=':ast.op==='!='?'<>':ast.op;
      return '('+l+op+r+')';
    }
    case 'fn': {
      let args=ast.args.map(a=>astToExcel(a, year, rowMap));
      let fn=ast.name.toUpperCase();
      switch(fn){
        case 'SUM': return 'SUM('+args.join(',')+')';
        case 'MIN': return 'MIN('+args.join(',')+')';
        case 'MAX': return 'MAX('+args.join(',')+')';
        case 'AVG': return 'AVERAGE('+args.join(',')+')';
        case 'IF':  return 'IF('+args[0]+','+args[1]+','+args[2]+')';
        case 'PREV': {
          if(year===0) return '0';
          let inner=ast.args[0];
          if(inner.kind!=='ref') throw new Error('PREV는 변수 참조만 지원');
          return _ref(inner.name, year-1);
        }
        default: throw new Error('미지 함수: '+fn);
      }
    }
  }
  throw new Error('AST 변환 실패');
}

function exportToExcel(){
  if(typeof XLSX==='undefined'){
    alert('XLSX 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인하거나 페이지를 새로고침하세요.');
    return;
  }
  // 토폴로지 정렬로 가독성 있는 순서 (Excel은 자동 평가하므로 사실 무관)
  let order;
  try{ order=topoSort(); } catch(e){ alert('순환 참조: '+e.message); return; }

  // 변수 → 행번호 (1-indexed, 헤더가 1행이므로 2부터)
  let rowMap={};
  order.forEach((k,i)=>{ rowMap[k]=i+2; });

  // 헤더
  let rows=[['Variable','Label','Unit',...YRS]];

  // 각 변수 행
  for(let k of order){
    let d=D[k]; if(!d) continue;
    let row=[k, d.label||k, d.u||''];
    if(d.type==='input'){
      for(let i=0;i<YRS.length;i++) row.push(d.v?d.v[i]:0);
    } else {
      // 수식 → Excel formula
      let ast=null;
      try{ ast=parseFormula(d.formula||''); } catch(e){}
      for(let i=0;i<YRS.length;i++){
        if(!ast){
          row.push(d.v?d.v[i]:0); continue;
        }
        try{
          let f=astToExcel(ast, i, rowMap);
          // {f: formula, v: cached value} — Excel이 다시 계산하지 않아도 표시 가능
          row.push({f, v:d.v?d.v[i]:0, t:'n'});
        } catch(e){
          row.push(d.v?d.v[i]:0);
        }
      }
    }
    rows.push(row);
  }

  // 시트 + 워크북
  let ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[
    {wch:18},  // Variable ID
    {wch:24},  // Label
    {wch:10},  // Unit
    ...YRS.map(()=>({wch:14})),
  ];
  // 헤더 굵게 (스타일은 SheetJS Community Edition에서 제한적이지만 셀 type 설정은 가능)
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Model');

  // 트리 구조 시트 (부가 정보)
  let treeRows=[['ID','Label','Parent','Type','Formula','Unit','Description']];
  for(let k of order){
    let d=D[k]; if(!d) continue;
    treeRows.push([k, d.label||'', d.parent||'', d.type||'', d.formula||'', d.u||'', d.desc||'']);
  }
  let wsTree=XLSX.utils.aoa_to_sheet(treeRows);
  wsTree['!cols']=[{wch:18},{wch:24},{wch:18},{wch:12},{wch:30},{wch:10},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsTree, 'Structure');

  let ts=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'financial_model_'+ts+'.xlsx');
}

// ============================================================
// SIM_SECS — 시뮬레이터 슬라이더 정의 (D에서 자동 생성)
//
// 입력 노드(type='input')를 부모(parent)별로 그룹핑하여 섹션 구성.
// min/max/step은 현재값과 단위에서 자동 추정 (필요시 D[k].sliderMin/Max/Step 명시).
// ============================================================
function buildSimSecs(){
  let byParent={};
  for(let k of INPUT_KEYS){
    let d=D[k]; if(!d) continue;
    let p=d.parent||'_orphan';
    (byParent[p]=byParent[p]||[]).push(k);
  }
  let secs=[];
  // root → leaves 순서로 부모 정렬
  let order=[];
  function walk(id){
    let kids=Object.keys(D).filter(k=>D[k].parent===id);
    if(byParent[id]) order.push(id);
    kids.forEach(walk);
  }
  walk('root');
  if(byParent['_orphan']) order.push('_orphan');

  for(let pid of order){
    let p=D[pid]||{};
    let inputs=byParent[pid];
    secs.push({
      t:(p.label||pid)+' 드라이버',
      c:p.bg||p.c||'#5D68F7',
      v:inputs.map(k=>{
        let d=D[k];
        // 사용자 명시값 우선, 없으면 자동 추정
        let cur=d.v && d.v.length ? Math.max(...d.v.map(Math.abs)) : 1;
        let min, max, step, pct;
        if(d.sliderMin!==undefined){
          min=d.sliderMin; max=d.sliderMax; step=d.sliderStep;
        } else if(d.pct){
          min=0; max=1; step=0.001; pct=1;
        } else if(d.u==='%'){
          min=0; max=1; step=0.001; pct=1;
        } else {
          // 현재값의 0~2배 범위, step은 그 1%
          min=0; max=Math.max(cur*2, 1);
          step=Math.max(max/100, 1);
          // 정수 단위 추정 (대/명/건 등은 step=1 이상)
          if(['대','명','건'].includes(d.u)) step=Math.max(Math.round(step), 1);
        }
        return {k, l:d.label, u:d.u, min, max, step, p:pct};
      })
    });
  }
  return secs;
}
SIM_SECS=buildSimSecs();

let _simYrs=new Set(); // empty = all (26~31)
function _sfv(v,vr){if(vr.p)return(v*100).toFixed(1)+'%';if(Math.abs(v)>=1e8)return(v/1e8).toFixed(0)+'억';if(Math.abs(v)>=1e6)return(v/1e6).toFixed(0)+'백만';if(Math.abs(v)>=1e4)return(v/1e4).toFixed(0)+'만';return Math.round(v).toLocaleString()}

function toggleSim(){
  let sp=document.getElementById('simPanel');
  if(sp.style.width==='400px'){sp.style.width='0';document.getElementById('simBtn').style.background='#5D68F720';document.getElementById('simBtn').style.borderColor='#5D68F7'}
  else{sp.style.width='400px';document.getElementById('simBtn').style.background='#5D68F740';document.getElementById('simBtn').style.borderColor='#5D68F7';_buildSim()}
  setTimeout(()=>{resize();renderAll();let _pops=document.querySelectorAll('.popup-overlay');let _sr=(document.getElementById('simPanel').offsetWidth||0)+'px';_pops.forEach(p=>{if(p.style.display==='flex'||p.classList.contains('show'))p.style.right=_sr})},350);
}

function _buildSim(){
  let sp=document.getElementById('simPanel');
  sp.innerHTML='<div style="padding:10px 14px;border-bottom:1px solid #eee;flex-shrink:0"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h3 style="font-size:13px;font-weight:600;flex:1">시뮬레이터</h3><button onclick="_resetSim()" style="border:none;background:none;cursor:pointer;font-size:14px;color:#999" title="전체 기본값">↺</button><button onclick="toggleSim()" style="border:none;background:none;cursor:pointer;font-size:15px;color:#999">✕</button></div><div id="_caseBar" style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #eee"></div></div><div id="_simBody" style="flex:1;overflow-y:auto;padding:12px 14px"></div>';
  _buildSliders();
  _renderCaseBar();
}

// ============ SCENARIO (CASE) MANAGEMENT ============
let _cases={}; // {name: {sv: deep copy of SV}}
let _activeCase=null; // null = base (기본값 or manual)

function _saveCaseState(){
  let snap={};for(let k in SV)snap[k]=SV[k].slice();return snap;
}
function _loadCaseState(snap){
  for(let k in snap)SV[k]=snap[k].slice();
  simCalc();renderAll();refreshOpenChart();_buildSliders();
  _renderCaseBar();
}
function _addCase(){
  let names=Object.keys(_cases);
  let next=String.fromCharCode(65+names.length); // A, B, C, ...
  if(names.length>=10)return;
  _cases[next]=_saveCaseState();
  _activeCase=next;
  _renderCaseBar();
}
function _switchCase(name){
  if(name===null){
    // Back to base (reset)
    _activeCase=null;
    for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();
    simCalc();renderAll();refreshOpenChart();_buildSliders();
    _renderCaseBar();return;
  }
  // Save current to active case before switching
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
  _activeCase=name;
  if(_cases[name])_loadCaseState(_cases[name]);
  _renderCaseBar();
}
function _updateActiveCase(){
  if(_activeCase&&_cases[_activeCase])_cases[_activeCase]=_saveCaseState();
}
function _deleteCase(name){
  delete _cases[name];
  if(_activeCase===name){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders()}
  _renderCaseBar();
}
function _renderCaseBar(){
  let bar=document.getElementById('_caseBar');if(!bar)return;
  bar.innerHTML='';
  // Base button
  let base=document.createElement('div');
  base.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;border:1px solid '+(_activeCase===null?'#333':'#ddd')+';background:'+(_activeCase===null?'#333':'#fff')+';color:'+(_activeCase===null?'#fff':'#888');
  base.textContent='기본값';
  base.onclick=function(){_switchCase(null)};
  bar.appendChild(base);
  // Case buttons
  Object.keys(_cases).sort().forEach(function(name){
    let btn=document.createElement('div');
    btn.style.cssText='padding:3px 10px;font-size:10px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;position:relative;border:1px solid '+(_activeCase===name?'#5D68F7':'#ddd')+';background:'+(_activeCase===name?'#5D68F7':'#fff')+';color:'+(_activeCase===name?'#fff':'#888');
    btn.textContent='Case '+name;
    btn.onclick=function(){_switchCase(name)};
    // Delete X
    let del=document.createElement('span');
    del.style.cssText='margin-left:6px;color:'+(_activeCase===name?'rgba(255,255,255,0.6)':'#ccc')+';font-size:9px;cursor:pointer';
    del.textContent='✕';
    del.onclick=function(e){e.stopPropagation();_deleteCase(name)};
    btn.appendChild(del);
    bar.appendChild(btn);
  });
  // Add button
  if(Object.keys(_cases).length<10){
    let add=document.createElement('div');
    add.style.cssText='padding:3px 8px;font-size:10px;border-radius:3px;cursor:pointer;border:1px dashed #ccc;color:#aaa';
    add.textContent='+ 케이스';
    add.onclick=_addCase;
    bar.appendChild(add);
  }
  // Count changes vs defaults
  let nChanged=0;for(let k in DEFAULTS_S)for(let i=0;i<YRS.length;i++)if(Math.abs(SV[k][i]-DEFAULTS_S[k][i])>1e-8)nChanged++;
  if(nChanged>0){
    let info=document.createElement('span');
    info.style.cssText='font-size:9px;color:#aaa;margin-left:4px';
    info.textContent=nChanged+'개 변경';
    bar.appendChild(info);
  }
}

let _selectedYrs=new Set();
let _collapsedSecs=new Set(); // empty = all 2026-2031

function _getAffectedYears(){
  if(_selectedYrs.size===0) return YRS.map((_,i)=>i).slice(1); // all except 실적 연도 (index 0)
  return [..._selectedYrs].filter(i=>i>0).sort();
}

function _buildSliders(){
  let bd=document.getElementById('_simBody');if(!bd)return;bd.innerHTML='';
  let activeYrs=_simYrs.size>0?[..._simYrs].sort():YRS.map((_,i)=>i).slice(1); // default: 모든 추정 연도 (실적 제외)

  // Year selector (multi-toggle)
  let yrWrap=document.createElement('div');yrWrap.style.cssText='margin-bottom:4px';
  let yrHint=document.createElement('div');yrHint.style.cssText='font-size:9px;color:#aaa;margin-bottom:4px';
  yrHint.textContent=_simYrs.size===0?'전체 연도 조정 (클릭하여 특정 연도 선택)':'선택된 연도만 조정';
  yrWrap.appendChild(yrHint);
  let yr=document.createElement('div');yr.style.cssText='display:flex;gap:2px';
  YRS.forEach((y,i)=>{
    let sel=_simYrs.has(i);
    let isLocked=i===0;
    let b=document.createElement('div');
    let bg=isLocked?'#F3F4F6':sel?'#333':(_simYrs.size===0&&i>0)?'#555':'#fff';
    let fg=isLocked?'#bbb':sel?'#fff':(_simYrs.size===0&&i>0)?'#fff':'#888';
    let bdr=isLocked?'#ddd':sel?'#333':(_simYrs.size===0&&i>0)?'#555':'#E5E7EB';
    b.style.cssText='flex:1;padding:3px 0;font-size:9px;text-align:center;border:1px solid '+bdr+';border-radius:3px;cursor:'+(isLocked?'default':'pointer')+';font-family:Arial,sans-serif;color:'+fg+';background:'+bg;
    b.textContent=isLocked?y+' 실적':y;
    if(!isLocked){
      b.onclick=()=>{
        if(_simYrs.has(i))_simYrs.delete(i);
        else _simYrs.add(i);
        // If all 26~31 selected, clear to mean "all"
        if(_simYrs.size===YRS.length-1&&!_simYrs.has(0)){_simYrs.clear()}
        _buildSliders();
      };
    }
    yr.appendChild(b);
  });
  yrWrap.appendChild(yr);
  bd.appendChild(yrWrap);

  // Display representative year for slider value (first selected, or 2026)
  let dispYr=activeYrs[0]||1;

  SIM_SECS.forEach(sec=>{
    let isOpen=!_collapsedSecs.has(sec.t);
    let h=document.createElement('div');h.style.cssText='font-size:11px;font-weight:600;color:#333;margin:12px 0 6px;padding-bottom:3px;border-bottom:2px solid '+sec.c+';cursor:pointer;display:flex;justify-content:space-between;align-items:center';
    h.innerHTML='<span>'+(isOpen?'▼':'▶')+' '+sec.t+'</span><span style="font-size:9px;color:#aaa;font-weight:400">'+sec.v.length+'개 변수</span>';
    h.onclick=function(){if(_collapsedSecs.has(sec.t))_collapsedSecs.delete(sec.t);else _collapsedSecs.add(sec.t);_buildSliders()};
    bd.appendChild(h);
    let secBody=document.createElement('div');secBody.style.display=isOpen?'block':'none';
    bd.appendChild(secBody);
    sec.v.forEach(vr=>{
      let val=SV[vr.k][dispYr],def=DEFAULTS_S[vr.k][dispYr];
      let anyChanged=false;
      for(let j=0;j<YRS.length;j++){if(Math.abs(SV[vr.k][j]-DEFAULTS_S[vr.k][j])>1e-8)anyChanged=true}

      let row=document.createElement('div');row.style.marginBottom='12px';

      // Label
      let lbl=document.createElement('div');lbl.style.cssText='display:flex;justify-content:space-between;font-size:10px;color:#666;margin-bottom:2px';
      let vs=document.createElement('span');vs.style.cssText='font-family:Arial,sans-serif;font-weight:500;color:#333';
      vs.textContent=_sfv(val,vr);
      let yrLabel=activeYrs.length===1?' ('+YRS[activeYrs[0]]+'년)':' ('+activeYrs.length+'개년)';
      lbl.innerHTML='<span>'+vr.l+'<span style="font-size:8px;color:#aaa">'+yrLabel+'</span>'+(anyChanged?' <span style="font-size:9px;color:#5D68F7;cursor:pointer;font-weight:500" class="_rst" data-k="'+vr.k+'">기본값</span>':'')+'</span>';
      lbl.appendChild(vs);row.appendChild(lbl);

      // Single/multi year slider
      let trk=document.createElement('div');trk.style.cssText='position:relative;height:18px;display:flex;align-items:center';
      if(def>=vr.min&&def<=vr.max){let mk=document.createElement('div');mk.style.cssText='position:absolute;top:50%;width:2px;height:10px;background:#5D68F7;border-radius:1px;transform:translate(-50%,-50%);pointer-events:none;z-index:1;left:'+((def-vr.min)/(vr.max-vr.min)*100)+'%';trk.appendChild(mk)}
      let rng=document.createElement('input');rng.type='range';rng.min=vr.min;rng.max=vr.max;rng.step=vr.step;rng.value=val;
      rng.style.cssText='width:100%;margin:0;-webkit-appearance:none;appearance:none;height:4px;background:#E5E7EB;border-radius:2px;outline:none';
      trk.appendChild(rng);row.appendChild(trk);

      rng.addEventListener('input',function(){
        let newVal=+this.value;
        activeYrs.forEach(j=>{SV[vr.k][j]=newVal});
        vs.textContent=_sfv(newVal,vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });

      // Bulk ±% slider
      let bulkRow=document.createElement('div');bulkRow.style.cssText='display:flex;align-items:center;gap:6px;margin-top:4px';
      let bulkLabel=document.createElement('span');bulkLabel.style.cssText='font-size:9px;color:#aaa;white-space:nowrap';bulkLabel.textContent='±%';
      let bulkVal=document.createElement('span');bulkVal.style.cssText='font-size:9px;font-family:Arial,sans-serif;color:#555;min-width:36px;text-align:center';bulkVal.textContent='±0%';
      let bulkRng=document.createElement('input');bulkRng.type='range';bulkRng.min='-50';bulkRng.max='100';bulkRng.step='1';bulkRng.value='0';
      bulkRng.style.cssText='flex:1;margin:0;-webkit-appearance:none;appearance:none;height:3px;background:linear-gradient(to right,#DC2626 0%,#E5E7EB 50%,#22C55E 100%);border-radius:2px;outline:none';
      let bulkReset=document.createElement('span');bulkReset.style.cssText='font-size:9px;color:#aaa;cursor:pointer';bulkReset.textContent='↺';
      bulkRow.appendChild(bulkLabel);bulkRow.appendChild(bulkRng);bulkRow.appendChild(bulkVal);bulkRow.appendChild(bulkReset);
      row.appendChild(bulkRow);

      let bulkBase=null;
      bulkRng.addEventListener('mousedown',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('touchstart',function(){bulkBase=SV[vr.k].slice()});
      bulkRng.addEventListener('input',function(){
        let pct=+this.value;
        bulkVal.textContent=(pct>=0?'+':'')+pct+'%';
        bulkVal.style.color=pct>0?'#22C55E':pct<0?'#DC2626':'#555';
        if(!bulkBase)bulkBase=DEFAULTS_S[vr.k].slice();
        activeYrs.forEach(j=>{
          let base=bulkBase[j];
          SV[vr.k][j]=vr.p?Math.max(0,Math.min(vr.max,base*(1+pct/100))):Math.max(vr.min,Math.min(vr.max,Math.round(base*(1+pct/100))));
        });
        rng.value=SV[vr.k][dispYr];
        vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_updateActiveCase();
      });
      bulkReset.onclick=function(){
        bulkRng.value=0;bulkVal.textContent='±0%';bulkVal.style.color='#555';
        activeYrs.forEach(j=>{SV[vr.k][j]=DEFAULTS_S[vr.k][j]});
        rng.value=SV[vr.k][dispYr];vs.textContent=_sfv(SV[vr.k][dispYr],vr);
        simCalc();renderAll();refreshOpenChart();_buildSliders();
      };

      // Reset all years for this var
      let rst=lbl.querySelector('._rst');
      if(rst)rst.onclick=function(e){e.stopPropagation();let k=this.dataset.k;for(let j=0;j<YRS.length;j++)SV[k][j]=DEFAULTS_S[k][j];simCalc();renderAll();refreshOpenChart();_buildSliders()};

      secBody.appendChild(row);
    });
  });
}

function _resetSim(){_activeCase=null;for(let k in DEFAULTS_S)SV[k]=DEFAULTS_S[k].slice();simCalc();renderAll();refreshOpenChart();_buildSliders();_renderCaseBar()}

</script>
